<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Patch</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="patch.css">
<style>
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px}
.top .who{font-size:.9rem;color:var(--mute);text-align:right;line-height:1.25}
.top .who button{background:none;border:0;color:var(--accent2);font:inherit;font-size:.82rem;padding:0;cursor:pointer}
h1.hi{font-size:clamp(1.6rem,5vw,2.2rem);margin:0 0 4px}
.found{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.found .stat b{font-size:1.7rem}
.found .stat.made b{color:var(--good)}
.sect{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}.sect h2{margin:0;font-size:1.2rem}.sect a,.sect button{margin-left:auto;font-size:.9rem;background:none;border:0;color:var(--accent2);font-weight:600;cursor:pointer;padding:0}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px}
.act .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.act h3{margin:0 0 4px;font-size:1.02rem;line-height:1.3}
.act p{margin:0 0 8px;color:var(--mute);font-size:.92rem}
.act .val{margin-left:auto;font-weight:700;color:var(--good);white-space:nowrap}
.act .val.soft{color:var(--mute);font-weight:600;font-size:.85rem}
.act .btns{display:flex;gap:8px;flex-wrap:wrap}
.act.done{opacity:.65}
.area{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent2);background:var(--tint);border-radius:6px;padding:2px 7px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;cursor:pointer;color:inherit;margin:0 0 8px}
.item:hover,.act:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:7px;background:var(--accent)}
.item .dot.good{background:var(--good)}.item .dot.warn{background:var(--warn)}.item .dot.bad{background:var(--bad)}
.item b{display:block}.item span.s{color:var(--mute);font-size:.9rem}
.item .x{margin-left:auto;background:none;border:0;color:var(--mute);font-size:1.2rem;line-height:1;padding:0 4px;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
.tabs button{flex:0 1 128px;background:none;border:0;border-radius:12px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--mute);cursor:pointer;position:relative}
.tabs button[aria-current=page]{background:var(--tint);color:var(--accent2)}
.tabs .n{position:absolute;top:0;right:6%;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.66rem;padding:0 5px;line-height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--mute)}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.icard small{display:block;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.icard b{display:block;font-family:var(--serif);font-size:1.5rem;margin:4px 0 2px}
.icard span{color:var(--mute);font-size:.88rem}
.back{background:none;border:0;color:var(--accent2);font:inherit;font-weight:600;padding:0;margin:0 0 10px;cursor:pointer}
.big{font-family:var(--serif);font-size:clamp(2rem,7vw,2.8rem);line-height:1;margin:2px 0 6px}
.rk{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}.rk:last-child{border-bottom:0}
.pips{display:flex;gap:3px}.pips i{flex:1;height:10px;border-radius:3px;background:var(--line)}.pips i.me{background:var(--accent)}
.check{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}.check:last-child{border-bottom:0}
.check .ok{color:var(--good);font-weight:700}.check .no{color:var(--bad);font-weight:700}
.qtable{width:100%;border-collapse:collapse;font-size:.9rem}.qtable td,.qtable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.qtable th{font-size:.72rem;text-transform:uppercase;color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.day[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day small{display:block;color:var(--mute);font-size:.72rem}.day b{display:block;font-size:.92rem;font-variant-numeric:tabular-nums}
.day i{display:block;height:4px;border-radius:2px;margin:6px auto 0;width:60%}.day i.good{background:var(--good)}.day i.warn{background:var(--warn)}
.hours{display:flex;flex-direction:column;gap:4px;margin:8px 0 14px}
.hrow{display:grid;grid-template-columns:48px 1fr 54px;gap:8px;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}.hrow .bar{height:14px}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;background:var(--card);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--tint)}
.drop b{display:block;font-size:1.05rem;margin:0 0 4px}
.drop label.btn{margin-top:10px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.uploads{margin-top:8px}
.small-in{width:90px;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--card)}
.post{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}
.stars{color:var(--warn);letter-spacing:1px}
.kitbox{width:100%;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);margin:6px 0;resize:vertical}
.kitsteps{padding-left:20px;margin:8px 0 12px}.kitsteps li{margin:0 0 6px}
.qrcard{display:block;width:100%;max-width:300px;margin:12px auto;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.btn.kitb{border-color:var(--accent);color:var(--accent2)}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap}
details.pb{border-bottom:1px solid var(--line)}details.pb>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer}details.pb>summary::-webkit-details-marker{display:none}details.pb[open]>summary{padding-bottom:4px}
.pcheck{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.pcheck .f{margin:0}@media(max-width:480px){.pcheck{grid-template-columns:1fr 1fr}}.pbt{margin:8px 0 12px;font-size:.82rem}.pbt a{color:var(--accent2)}.linkbtn{background:none;border:0;padding:0;color:var(--accent2);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
details.more>summary{cursor:pointer;color:var(--accent2);font-weight:600;margin:6px 0}
.empty{color:var(--mute);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.5);display:grid;place-items:center;padding:16px;z-index:60}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
@media(min-width:900px){.wrap{max-width:1020px}.homegrid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}}
@media(max-width:430px){.rk{grid-template-columns:110px 1fr 56px}.tabs button{font-size:.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="./">Patch<i>.</i></a><span class="sp"></span><span class="who" id="who"></span></header>
  <div id="demo"></div>
  <main id="app"><p class="mute">Loading…</p></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="Sections">
  <button data-tab="home">Home</button><button data-tab="actions">Actions</button><button data-tab="insights">Insights</button><button data-tab="plan">Plan</button><button data-tab="upload">Upload</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="patch-core.js"></script>
<script src="patch-ops.js"></script>
<script src="patch-insights.js"></script>
<script src="patch-data.js"></script>
<script src="patch-kits.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
(function () {
"use strict";
const P = PatchCore, O = PatchOps, I = PatchInsights, D = PatchData, Q = new URLSearchParams(location.search), token = Q.get("t") || (D.DEMO ? "demo-owner" : "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s), money = P.money, pounds = n => "£" + Math.round(n || 0).toLocaleString("en-GB");
const today = O.iso(new Date());
const dd = s => new Date(String(s).slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const hr = h => (h === 0 ? "12am" : h < 12 ? h + "am" : h === 12 ? "12pm" : h - 12 + "pm");
const pence = x => (x < 1 ? Math.round(x * 100) + "p" : money(x));
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2400); }
let W = null, S = null;
const V = { tab: "home", sub: null, day: today, reply: null, filter: "todo" };
const ctx = () => ({ district: (W.venue.postcode || "").split(" ")[0], cafe: W.venue.name, calendar: W.area.calendar || [], newNearby: W.newNearby || [], venue: W.venue, moves: (W.rank || {}).moves || [] });

let saveT = null;
function save(msg) { clearTimeout(saveT); saveT = setTimeout(async () => { try { await D.rpc("owner_put", { p_token: token, p_state: S }); if (msg) toast(msg); } catch (e) { toast("Not saved: " + e.message); } }, 300); }

/* ---------- what Patch knows, worked out once per render ---------- */
function facts() {
  const invLines = (S.invoices || []).filter(x => x.at >= O.addD(today, -120)).flatMap(x => x.lines || []);
  const suppliers = I.supplierFindings(invLines, W.area.supplyBench, S.priceCheck), seo = I.seoScore(W.seo && W.seo.checks), geo = I.geoSummary(W.geo, W.venue.name);
  const thread = I.goldenThread({ today, report: W.report, suppliers, seo, geo, visitRank: W.rank && W.rank.visit, moves: (W.rank || {}).moves, state: S, venue: W.venue });
  const made = (S.changes || []).reduce((t, c) => t + (O.priceImpact(S, c, today).extra || 0), 0);
  return { suppliers, seo, geo, thread, made, open: thread.filter(a => a.status !== "done" && a.status !== "skip") };
}

/* ---------- shell ---------- */
function render() {
  const F = facts();
  document.querySelectorAll("[data-tab]").forEach(b => { if (b.dataset.tab === V.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const ab = document.querySelector('[data-tab=actions]'); ab.innerHTML = `Actions${F.open.length ? `<span class="n">${F.open.length}</span>` : ""}`;
  $("#app").innerHTML = ({ home: vHome, actions: vActions, insights: vInsights, plan: vPlan, upload: vUpload })[V.tab](F);
  scrollTo(0, 0);
}
function actionCard(a, compact) {
  const val = a.value ? `<span class="val">${pounds(a.value)} a year${a.estimate ? "*" : ""}</span>` : `<span class="val soft">${{ Google: "Helps you get found", "AI answers": "Helps you get recommended", Reviews: "Builds trust", Visit: "Better visits", Admin: "Keeps you covered", Sales: "Fills a quiet hour", "Opening hours": "New customers" }[a.area] || ""}</span>`;
  return `<article class="act ${a.status === "done" ? "done" : ""}" data-key="${esc(a.key)}"><div class="meta"><span class="area">${esc(a.area)}</span><span class="chip">${esc(I.EFFORT[a.effort])}</span>${a.status === "doing" ? '<span class="chip warn">Doing</span>' : a.status === "done" ? '<span class="chip good">Done</span>' : ""}${val}</div>
    <h3>${esc(a.t)}</h3><p>${esc(a.why)}</p>${!compact && a.steps ? `<ul class="sm" style="margin:0 0 8px;padding-left:18px">${a.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    <div class="btns">${a.status !== "done" ? `<button class="btn sm" data-done="${esc(a.key)}">Done</button>${a.status !== "doing" ? `<button class="btn q sm" data-doing="${esc(a.key)}">I'm on it</button>` : ""}` : `<button class="btn q sm" data-undo="${esc(a.key)}">Not done after all</button>`}${a.status !== "done" && kitFor(a) ? `<button class="btn q sm kitb" data-kit="${esc(a.key)}">${KIT_BTN[kitFor(a)]}</button>` : ""}<button class="btn q sm" data-go="${esc(a.go)}">See why</button>${!compact && a.status !== "done" ? `<button class="btn q sm" data-skip="${esc(a.key)}">Not for us</button>` : ""}</div></article>`;
}

/* ---------- home ---------- */
function vHome(F) {
  const h = new Date().getHours(), worth = F.open.reduce((t, a) => t + (a.value || 0), 0);
  const brief = O.briefing(S, ctx(), today).filter(i => !["rev", "rem", "win", "theme", "post"].includes(i.k)).slice(0, 3);
  return `<p class="sm mute" style="margin:0">${new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}</p><h1 class="hi">Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}${W.name ? ", " + esc(W.name.split(/\s+/)[0]) : ""}</h1>
    <div class="found"><div class="stat"><b>${pounds(worth)}</b><span>a year in the actions waiting for you</span></div><div class="stat made"><b>${pounds(F.made)}</b><span>made so far from changes you've made</span></div></div>
    <div class="homegrid"><section><div class="sect"><h2>Do next</h2><button data-tab-go="actions">All ${F.open.length}</button></div>
      ${F.open.length ? F.open.slice(0, 3).map(a => actionCard(a, true)).join("") : `<p class="empty">Nothing waiting. We'll add actions as we learn more about your patch.</p>`}</section>
    <section><div class="sect"><h2>This week</h2></div>${brief.map(i => `<div class="item" role="button" tabindex="0" data-go="${esc(i.go === "week" ? "plan" : i.go === "more:area" ? "insights:local" : i.go === "more:sales" ? "upload" : i.go)}"><span class="dot ${i.tone}"></span><span><b>${esc(i.t)}</b><span class="s">${esc(i.s)}</span></span>${i.dkey ? `<button class="x" data-dismiss="${esc(i.dkey)}" aria-label="Dismiss">×</button>` : ""}</div>`).join("")}
      <button class="item" data-tab-go="upload"><span class="dot"></span><span><b>Add sales or invoices</b><span class="s">The more we see, the sharper your forecast and supplier checks.</span></span></button></section></div>`;
}

/* ---------- actions: the golden thread ---------- */
function vActions(F) {
  const f = V.filter, list = F.thread.filter(a => f === "todo" ? a.status === "todo" || a.status === "doing" : f === "done" ? a.status === "done" : a.status === "skip");
  const n = s => F.thread.filter(a => s === "todo" ? a.status === "todo" || a.status === "doing" : a.status === s).length;
  return `<h2>Your actions</h2><p class="sm mute">Everything Patch finds becomes one list: what to do, why, and what it's worth. Most money first.</p>
    <div class="chips">${[["todo", "To do"], ["done", "Done"], ["skip", "Not for us"]].map(([k, t]) => `<button data-filter="${k}" aria-pressed="${f === k}">${t} (${n(k)})</button>`).join("")}</div>
    ${list.length ? list.map(a => actionCard(a, false)).join("") : `<p class="empty">${f === "todo" ? "All done. Nice." : "Nothing here yet."}</p>`}
    ${F.thread.some(a => a.estimate) ? `<p class="xs mute">* Estimated from a typical café's sales. Upload sales with item names for your own figures.</p>` : ""}`;
}

/* ---------- insights ---------- */
function vInsights(F) {
  if (V.sub) return `<button class="back" data-sub="">‹ Insights</button>` + ({ ranking: iRanking, search: iSearch, prices: iPrices, suppliers: iSuppliers, reviews: iReviews, local: iLocal })[V.sub](F);
  const vr = W.rank && W.rank.visit, priced = ((W.report || {}).items || []).filter(i => i.diff != null), under = priced.filter(i => i.diff <= -0.1).length;
  const unrep = (S.reviews || []).filter(r => +r.rating <= 3 && !r.replied).length, sup = F.suppliers.filter(s => s.perYear > 0);
  const card = (k, label, big, s) => `<button class="icard" data-sub="${k}"><small>${label}</small><b>${big}</b><span>${s}</span></button>`;
  return `<h2>Insights</h2><div class="cards">
    ${card("ranking", "On our last visit", vr ? `${I.ord(vr.rank)} of ${vr.of}` : "Not visited yet", vr ? `Among the cafés nearest you, ${dd(vr.at)}${vr.before ? `. ${vr.rank < vr.before.rank ? "Up" : vr.rank > vr.before.rank ? "Down" : "Same as"} from ${I.ord(vr.before.rank)}` : ""}.` : "We'll visit soon.")}
    ${card("search", "Google and AI", F.seo ? `${F.seo.score}/100` : "Not checked", `${F.geo ? `AI assistants mention you in ${F.geo.share}% of answers` : "AI answers not checked yet"}.`)}
    ${card("prices", "Your prices", priced.length ? `${under} below` : "–", priced.length ? `of ${priced.length} items are below what your neighbours charge.` : "Send us your menu to compare.")}
    ${card("suppliers", "Suppliers", sup.length ? pounds(sup.reduce((t, s) => t + s.perYear, 0)) : F.suppliers.length ? "On par" : I.priceBook().length + " prices", sup.length ? "a year more than cafés like yours pay." : F.suppliers.length ? "You're paying about what others do." : "What cafés pay for milk, beans, cups and more. Check yours.")}
    ${card("reviews", "Reviews", String((S.reviews || []).length), unrep ? `${unrep} waiting for a reply.` : "All replied to.")}
    ${card("local", "Your area", String(P.calendarFor(ctx().calendar, ctx().district, today, 28).length), `things on locally in the next 4 weeks${(W.newNearby || []).length ? `, ${W.newNearby.length} new café${W.newNearby.length > 1 ? "s" : ""} nearby` : ""}.`)}</div>`;
}
function iRanking() {
  const vr = W.rank && W.rank.visit;
  if (!vr) return `<section class="card"><h2>Ranking on visits</h2><p>We haven't visited yet. Our visitors score every café nearby on the same things, so you can see where you stand.</p></section>`;
  const pips = (r, of) => `<span class="pips" aria-label="${I.ord(r)} of ${of}">${Array.from({ length: of }, (_, i) => `<i class="${i === r - 1 ? "me" : ""}"></i>`).join("")}</span>`;
  return `<section class="card"><p class="sm mute" style="margin:0">On our visit on ${dd(vr.at)}, against the ${vr.of - 1} cafés nearest you that we visited</p><p class="big">${I.ord(vr.rank)} of ${vr.of}</p>
    ${vr.before ? `<p class="sm">${vr.rank < vr.before.rank ? `<span class="chip good">Up from ${I.ord(vr.before.rank)}</span>` : vr.rank > vr.before.rank ? `<span class="chip warn">Down from ${I.ord(vr.before.rank)}</span>` : `<span class="chip">Same as last time</span>`} since our visit on ${dd(vr.before.at)}.</p>` : ""}
    <h3 style="margin-top:14px">Thing by thing</h3>${vr.dims.map(d => `<div class="rk"><span>${esc(d.t)}</span>${pips(d.rank, d.of)}<span class="sm" style="text-align:right">${I.ord(d.rank)}</span></div>`).join("")}
    <p class="sm" style="margin-top:12px"><b>Best at:</b> ${esc(vr.strongest.t.toLowerCase())}. <b>Most room to improve:</b> ${esc(vr.weakest.t.toLowerCase())}${vr.weakest.k === "wait" ? ` (${vr.weakest.mine} minutes; the middle nearby is ${vr.weakest.middle})` : ""}.</p>
    <p class="xs mute">Overall also counts your food hygiene rating. Other cafés are never named, and never see your scores.</p></section>`;
}
function iSearch(F) {
  const s = F.seo, g = F.geo, peers = (W.rank && W.rank.seoPeers) || [];
  const myRank = s ? 1 + peers.filter(x => x > s.score).length : null;
  let h = `<section class="card"><h2>On Google</h2>${s ? `<p class="big">${s.score}<span style="font-size:1.1rem;color:var(--mute)">/100</span></p><p class="sm">${peers.length ? `${I.ord(myRank)} of ${peers.length + 1} cafés near you. The middle score nearby is ${Math.round(P.median(peers))}.` : ""} Checked ${W.seo.at ? dd(W.seo.at) : "recently"}.</p>

let pdfjs = null;
async function pdfText(file) {
  if (!pdfjs) { await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise; let out = "";
  for (let i = 1; i <= Math.min(doc.numPages, 20); i++) { const c = await (await doc.getPage(i)).getTextContent(), rows = {};
    c.items.forEach(t => { const y = Math.round(t.transform[5]); (rows[y] = rows[y] || []).push({ x: t.transform[4], s: t.str }); });
    out += Object.keys(rows).sort((a, b) => b - a).map(y => rows[y].sort((a, b) => a.x - b.x).map(t => t.s).join("  ")).join("\n") + "\n"; }
  return out;
}

  g.font = "400 50px Inter, system-ui, sans-serif"; g.fillStyle = "#3d4a44"; g.fillText("We'd love a Google review", W2 / 2, 270);
  stars(g, W2 / 2, 360, 5, 34);

function docsList() {
  const docs = (S.docs || []).slice().sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
  return docs.length ? `<div class="card uploads" style="margin-top:10px">${docs.map(x => `<div class="line"><span>${esc(x.title)}<br><span class="xs mute">${esc(x.name)} · added ${dd(x.at)}${x.premium ? ` · ${gbp(x.premium)}` : ""}${x.insurer ? " · " + esc(x.insurer) : ""}</span></span><span class="sm" style="text-align:right">${x.due ? `Next due<br><b>${dY(x.due)}</b>` : ""}${x.file && (x.file.data || x.file.path) ? `<br><button class="linkbtn xs" data-opendoc="${x.id}">Open</button>` : ""}</span></div>`).join("")}</div>` : "";
}

/* ---------- events ---------- */
function setAction(key, status) { S.actions = S.actions || {}; S.actions[key] = { status, at: today }; save(status === "done" ? "Nice one. Marked as done." : null); }
function go(where) { const [t, sub] = String(where).split(":"); V.tab = t === "more" ? (sub === "reminders" ? "actions" : "insights") : t; V.sub = t === "insights" ? sub || null : t === "more" && sub !== "reminders" ? (sub === "area" ? "local" : sub) : null; render(); }
document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-go],[data-sub],[data-day]"); if (!t) return; const d = t.dataset;
  if (d.dismiss) { e.stopPropagation(); S.dismissed = S.dismissed || {}; S.dismissed[d.dismiss] = today; save(); return render(); }
  if (d.tab || d.tabGo) { V.tab = d.tab || d.tabGo; V.sub = null; return render(); }
  if (d.go) return go(d.go);
  if (d.sub !== undefined) { V.sub = d.sub || null; return render(); }
  if (d.day) { V.day = d.day; return render(); }
  if (d.filter) { V.filter = d.filter; return render(); }
  if (d.doing) { setAction(d.doing, "doing"); return render(); }
  if (d.skip) { setAction(d.skip, "skip"); return render(); }
  if (d.undo) { setAction(d.undo, "todo"); return render(); }
  if (d.done) { const a = facts().thread.find(x => x.key === d.done);
    if (a && a.done === "logprice") return priceModal(Object.assign({ key: a.key }, a.prefill));
    setAction(d.done, "done"); if (a && a.key.startsWith("rem:")) { const k = a.key.slice(4), own = (S.reminders || []).find(r => "r:" + r.id === k);
      if (own) { if (own.every) { const n = new Date((own.due || today) + "T12:00:00Z"); n.setUTCMonth(n.getUTCMonth() + +own.every); own.due = O.iso(n); } else own.done = true; } else { S.dismissed = S.dismissed || {}; S.dismissed[k] = today; } }
    return render(); }
  if (d.kit) return openKit(d.kit);
  if (d.adddoc) return docModal(null);
  if (d.opendoc) return openDoc(d.opendoc);
  if (d.kitdone) { setAction(d.kitdone, "done"); closeModal(); return render(); }
  if (d.copybox) { const el = $("#" + d.copybox); try { await navigator.clipboard.writeText(el.value); toast("Copied"); } catch (x) { el.focus(); el.select(); toast("Selected: copy it from here"); } return; }
  if (d.k === "rl-demo") { $("#k-rl").value = "https://g.page/r/CdemoLittleFigEAE/review"; }
  if (d.k === "rl-make" || d.k === "rl-demo") { const r = Kt.reviewLink($("#k-rl").value); $("#k-rlerr").textContent = r.error || ""; if (r.error) return; S.settings.reviewLink = r.url; save(); makeCard(r.url); return; }
  if (d.k === "doc-save") return saveDoc(t);
  if (d.k === "mb-save") return saveMenu();
  if (d.pcsave) { const k = d.pcsave, v = f => (document.querySelector(`[data-pc="${k}.${f}"]`) || {}).value || "", price = parseFloat(v("price").replace(/[£,\s]/g, ""));
    const err = $("#pc-" + k); if (!(price > 0)) { err.textContent = "Type in what you pay, in pounds."; return; }
    if (!I.packSize(v("pack"), I.SUPPLY[k].unit)) { err.textContent = `We can't tell how much is in “${v("pack")}”. Try something like 6 x 1L, 1kg or box of 1000.`; return; }
    S.priceCheck = S.priceCheck || {}; S.priceCheck[k] = { price, pack: v("pack").trim(), weekly: parseFloat(v("weekly")) || I.SUPPLY[k].wk, at: today }; V.pb = k; save("Compared"); return render(); }
  if (d.pcclear) { delete (S.priceCheck || {})[d.pcclear]; V.pb = d.pcclear; save("Cleared"); return render(); }
  if (d.reply) { V.reply = d.reply; return render(); }
  if (d.replied) { const r = S.reviews.find(x => x.id === d.replied); r.replied = true; V.reply = null; save("Marked as replied"); return render(); }
  if (d.copy != null) { const el = $("#post" + d.copy); try { await navigator.clipboard.writeText(el.textContent); toast("Copied"); } catch (x) { const r = document.createRange(); r.selectNodeContents(el); getSelection().removeAllRanges(); getSelection().addRange(r); } return; }
  if (d.delprep) { S.prep.splice(+d.delprep, 1); save(); return render(); }
  switch (d.act) {
    case "addprep": S.prep.push({ name: "", perDay: "" }); return render();
    case "logchange": { const it = $("#pc-item").value.trim(), f = parseFloat($("#pc-from").value), to = parseFloat($("#pc-to").value);
      if (!it || isNaN(f) || isNaN(to)) { $("#pc-err").textContent = "Fill in the item, what it was and what it is now."; return; }
      S.changes = S.changes || []; S.changes.push({ id: O.uid(), item: it, k: (P.ITEMS.find(i => i.t.toLowerCase() === it.toLowerCase()) || {}).k, from: f, to, at: $("#pc-at").value || today });
      if (d.key) setAction(d.key, "done"); save("Logged. We'll track what it brings in."); const m = $("#modal"); if (m) m.remove(); return render(); }
    case "closemodal": return $("#modal").remove();
    case "addreview": { const txt = $("#rv-t").value.trim(); if (!txt) return; S.reviews = S.reviews || []; S.reviews.push({ id: O.uid(), at: today, rating: +$("#rv-r").value, author: $("#rv-a").value.trim(), text: txt }); save("Added"); return render(); }
    case "copyreply": try { await navigator.clipboard.writeText($("#replyText").value); toast("Copied"); } catch (x) { $("#replyText").select(); } return;
  }
});
function priceModal(pre) {
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">What did you change it to?</h2><p class="sm mute">We'll track what it brings in, from your sales.</p>${priceForm(pre)}<button class="btn q" data-act="closemodal" style="margin-left:6px">Cancel</button></div>`;
  document.body.appendChild(m);
}
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".item[data-go]")) { e.preventDefault(); go(e.target.dataset.go); } });
document.addEventListener("toggle", e => { const el = e.target; if (el.matches && el.matches("details.pb")) { if (el.open) V.pb = el.dataset.pb; else if (V.pb === el.dataset.pb) V.pb = null; } }, true);
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.file && t.files.length) return handleFiles(d.file, [...t.files]);
  if (t.id === "k-docfile" && t.files.length) return readDoc(t.files[0]);
  if (t.id === "menuIn" && t.files.length) return readMenu(t.files[0]);
  if (t.id === "emailOn") { D.rpc("owner_email_pref", { p_token: token, p_on: t.checked }).then(ok => { W.emailOn = t.checked; toast(ok ? (t.checked ? "We'll email you on Mondays" : "No more Monday emails") : "Not saved"); }).catch(e => toast("Not saved: " + e.message)); return; }
  if (t.id === "k-phone") { S.settings.phone = t.value.trim(); save(); $("#k-schema").value = schemaFor(); return; }
  if (d.shot != null) { S.shots = S.shots || {}; S.shots[d.shot] = t.checked; save(); return; }
  if (d.set) { S.settings[d.set] = ["special", "website"].includes(d.set) ? t.value.trim() : +t.value || ""; save("Saved"); if (d.set !== "website") render(); return; }
  if (d.prep) { const [i, k] = d.prep.split("."); S.prep[+i][k] = k === "perDay" ? +t.value || "" : t.value; save("Saved"); return; }
  if (d.rem != null) { S.reminders[+d.rem].due = t.value || null; S.reminders[+d.rem].done = false; save("Saved"); }
});
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.add("over"); } }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.remove("over"); if (ev === "drop" && e.dataTransfer.files.length) handleFiles(z.dataset.drop, [...e.dataTransfer.files]); } }));

/* ---------- start ---------- */
async function boot() {
  if (D.DEMO) $("#demo").innerHTML = `<p class="demo"><b>Demo.</b> A made-up café with made-up figures. Changes stay in this browser.</p>`;
  if (!token) { $("#app").innerHTML = `<p class="card">Open Patch from the link in your email.</p>`; return; }
  try { W = await D.rpc("owner_get", { p_token: token }); } catch (e) { W = null; }
  if (!W || !W.venue) { $("#app").innerHTML = `<p class="card">We couldn't find your café. Use the link from your email.</p>`; return; }
  W.area = W.area || { name: "", calendar: [], costs: [] };
  // After a price sweep, the area's latest comparison is fresher than the report snapshot.
  if (W.rank && W.rank.prices && W.rank.prices.length) W.report = Object.assign({}, W.report || {}, { items: W.rank.prices });
  S = W.state || {}; S.settings = Object.assign({ perStaffHour: 60, minStaff: 1, special: "", website: "" }, S.settings || {}); S.prep = S.prep || [];
  if (!S.reminders) S.reminders = O.DEFAULT_REMINDERS.map(([t, every]) => ({ id: O.uid(), t, every, due: null }));
  $("#who").innerHTML = `<b>${esc(W.venue.name)}</b><br>${esc(W.area.name)}`; document.title = `${W.venue.name} · Patch`; $("#tabs").hidden = false;
  render();
}
window.__owner = { get S() { return S; }, V, facts: () => facts() };
boot();
})();
</script>
