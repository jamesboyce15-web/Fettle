<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your family plan · Fettle</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--brand:#173f35;--bg:#f6f7f4;--ink:#1c2522;--mute:#5b6763}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--brand)}
.top{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto;padding:14px 16px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);font-weight:700;font-size:1.25rem}
.sp{flex:1}
.live{display:none;align-items:center;gap:6px;background:#fde7e5;color:#b3261e;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}
.live.on{display:inline-flex}.live i{width:8px;height:8px;border-radius:50%;background:#b3261e;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.pbtn{background:#fff;border:1px solid #cfd6d2;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:4px 16px 48px}
.msg{background:#fff;border:1px solid #dfe4e0;border-radius:16px;padding:22px}
body.big{font-size:20px}
@media print{.top .pbtn,.live{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#173f35"/><path d="M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z" fill="none" stroke="#f6f7f4" stroke-width="2" stroke-linejoin="round"/><path d="M16 14.5c1.9 1.7 2.8 3.2 2.8 4.6a2.8 2.8 0 0 1-5.6 0c0-1.4.9-2.9 2.8-4.6z" fill="#f2a900"/></svg>fettle</a>
  <span class="sp"></span>
  <span class="live" id="live"><i></i>Live</span>
  <button class="pbtn" onclick="window.print()">Print</button>
</header>
<main id="app"><p class="msg">Loading your plan…</p></main>
<script src="config.js"></script>
<script src="call-kit.js"></script>
<script src="call-demo.js"></script>
<script src="plan-view.js"></script>
<script>
(function () {
  const CFG = window.FETTLE_CONFIG || {}, Q = new URLSearchParams(location.search), app = document.getElementById("app");
  const token = Q.get("t") || "", live = Q.has("live"), demo = Q.has("demo");
  let band = Q.get("band") || "a", last = "";
  if (live) { document.getElementById("live").classList.add("on"); document.body.classList.add("big"); }

  const rpc = async (fn, body) => {
    const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, { method: "POST",
      headers: { apikey: CFG.supabaseAnonKey, Authorization: `Bearer ${CFG.supabaseAnonKey}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
    if (!r.ok) throw new Error((j && j.message) || "That didn't work. Please try again.");
    return j;
  };
  async function load() {
    if (window.FETTLE_FAKE_PLAN) return window.FETTLE_FAKE_PLAN;
    if (demo || !CFG.supabaseUrl) { try { const m = localStorage.getItem("fettle-demo-live-" + token); if (m) return JSON.parse(m); } catch (e) {} const c = FettleDemo.clients.find(x => x.share_token === (token || "demo-hughes")) || FettleDemo.clients[0]; return FettleDemo.plan(c); }
    if (!/^[0-9a-f-]{36}$/i.test(token)) return null;
    return rpc("family_plan", { p_token: token });
  }
  async function message(text, name) {
    if (window.FETTLE_FAKE_PLAN || demo || !CFG.supabaseUrl) { (window.__sentMessages = window.__sentMessages || []).push({ text, name }); return true; }
    const ok = await rpc("family_message", { p_token: token, p_body: text, p_author: name || "" });
    if (!ok) throw new Error("We couldn't find this plan.");
    return ok;
  }
  async function tick() {
    let P = null;
    try { P = await load(); } catch (e) { if (!last) app.innerHTML = `<p class="msg">We couldn't load the plan just now. Please refresh the page.</p>`; return; }
    if (!P) { app.innerHTML = `<p class="msg">We couldn't find this plan. Check the link in your email, or contact your coordinator at <a href="mailto:hello@getfettle.co.uk">hello@getfettle.co.uk</a>.</p>`; return; }
    const sig = JSON.stringify(P);
    if (sig === last) return;
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest("#fpv-change");
    if (last && typing) return; // don't redraw under someone typing a message
    last = sig;
    document.title = `The ${P.family_name || "family"} family plan · Fettle`;
    FettlePlanView.render(app, P, { band, live, onBand: k => { band = k; }, canMessage: !live, onMessage: message });
  }
  tick();
  if (live) setInterval(tick, 4000);
})();
</script>
</body>
</html>
