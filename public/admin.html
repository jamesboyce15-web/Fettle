<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Patch admin</title>
<link rel="preload" href="fonts/schibsted.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="patch.css">
<style>
body{font-size:15.5px}
.wrap{max-width:1180px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer}
.nav button[aria-current=page]{background:var(--tint);color:var(--accent2)}
.nav .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 7px;margin-left:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}.split>*{min-width:0}
.panel{position:sticky;top:12px}
.t tbody tr.click{cursor:pointer}.t tbody tr.click:hover{background:var(--tint)}.t tr.sel{background:var(--tint)}
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}
.prices .f input{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 10px}
.seg button{background:var(--card);border:0;border-left:1px solid var(--line);padding:7px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.scorerow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hrs{display:grid;grid-template-columns:90px 1fr 1fr 80px;gap:6px;align-items:center;font-size:.9rem}
.hrs input{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--card);width:100%}
.modal{position:fixed;inset:0;background:rgba(20,15,12,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal .box{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.signin{max-width:380px;margin:12vh auto}
.t input,.t select{border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--card)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}
.pill.ok{background:var(--good)}.pill.part{background:var(--warn)}
@media(max-width:980px){.split{grid-template-columns:1fr}.panel{position:static}}
</style>
</head>
<body>
<div class="wrap"><div id="root"><p class="mute" style="padding:20px">Loading…</p></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="patch-sectors.js"></script>
<script src="patch-core.js"></script>
<script src="patch-ops.js"></script>
<script src="patch-insights.js"></script>
<script src="patch-data.js"></script>
<script src="patch-emails.js"></script>
<script src="patch-offers.js"></script>
<script src="patch-search.js"></script>
<script>
(function () {
"use strict";
const P = PatchCore, D = PatchData, CFG = D.CFG, I = PatchInsights;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s), money = P.money;
const today = () => new Date().toISOString().slice(0, 10);
const fmtD = s => s ? new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const ago = s => { const d = (Date.now() - new Date(s)) / 864e5; const n = Math.round(d); return d < 1 ? "today" : n === 1 ? "yesterday" : n + " days ago"; };
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }
const reportUrl = tok => `${location.protocol === "file:" ? "report.html" : location.origin + location.pathname.replace(/admin(\.html)?$/, "report")}?t=${encodeURIComponent(tok)}${D.DEMO ? "&demo=1" : ""}`;
const ownerUrl = tok => `${location.protocol === "file:" ? "owner.html" : location.origin + location.pathname.replace(/admin(\.html)?$/, "owner")}?t=${encodeURIComponent(tok)}${D.DEMO ? "&demo=1" : ""}`;
const STATUS = { new: "New", report_sent: "Report sent", founding: "Wants setting up", not_now: "Not now" };

let DB, ME, S = { areas: [], area: null, venues: [], obs: [], requests: [] };
const V = { view: "requests", req: null, q: "", all: false, rec: { venue: null, source: "visit", scores: {}, prices: {}, hours: null }, cal: [], costs: [], profile: {}, draft: null };
const venue = id => S.venues.find(v => v.id === id);

async function loadArea(id) {
  S.area = S.areas.find(a => a.id === id) || S.areas[0];
  if (!S.area) { S.venues = []; S.obs = []; return; }
  P.useSector(S.area.sector);
  [S.venues, S.obs] = await Promise.all([DB.venues(S.area.id), DB.observations(S.area.id)]);
  V.cal = clone(S.area.calendar || []); V.costs = clone(S.area.costs || []); V.profile = clone(S.area.profile || {});
}
const clone = o => JSON.parse(JSON.stringify(o));
const bench = () => Object.assign({}, P.BENCH, (S.area && S.area.bench) || {});

/* ---------- shell ---------- */
function render() {
  const nNew = S.requests.filter(r => r.status === "new" && (!S.area || r.area_id === S.area.id)).length;
  const nFound = S.requests.filter(r => r.founding_interest && r.status !== "founding").length;
  const nav = (v, t, n) => `<button data-nav="${v}" ${V.view === v ? 'aria-current="page"' : ""}>${t}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  $("#root").innerHTML = `<header class="top"><a class="brand" href="./${D.DEMO ? "?demo=1" : ""}">Patch<i>.</i></a><span class="mute sm" style="font-weight:700">Prices</span><span class="sp"></span>
    <select id="areaSel" aria-label="Area" style="border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card)">${S.areas.map(a => `<option value="${a.id}" ${S.area && a.id === S.area.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select>
    <a class="btn sm" href="members${D.DEMO ? ".html?demo=1" : ""}">Front desk</a><button class="btn q sm" data-act="signout">${D.DEMO ? "Reset demo" : "Sign out"}</button></header>
    ${D.DEMO ? `<p class="demo"><b>Demo.</b> Made-up cafés, saved only in this browser. Try: open a request, build the report, then open the report link.</p>` : ""}
    <nav class="nav">${nav("requests", "Report requests", nNew + nFound)}${nav("record", "Record prices")}${nav("sweeps", "Price sweeps")}${P.SECTOR === "salon" ? nav("coverage", "Coverage") : ""}${nav("cafes", P.SECTOR === "salon" ? "Businesses" : "Cafés")}${nav("area", "Area page")}${nav("emails", "Emails")}
      ${LATER.includes(V.view) || V.later ? LATER_NAV.map(([k, t]) => nav(k, t)).join("") : ""}<button data-act="later" class="xs" style="margin-left:auto" aria-expanded="${!!(V.later || LATER.includes(V.view))}">${V.later || LATER.includes(V.view) ? "Hide later" : "Later ›"}</button></nav>
    <div id="main">${view()}</div>`;
}
// The core is prices and the front desk. These still work, but stay out of the way until they're needed.
const LATER_NAV = [["search", "Search and AI"], ["calendar", "Local calendar"], ["offers", "Offers"], ["settings", "Costs"]], LATER = LATER_NAV.map(x => x[0]);
function view() { try { return ({ requests: vRequests, record: vRecord, cafes: vCafes, search: vSearch, calendar: vCalendar, area: vArea, coverage: vCoverage, offers: vOffers, settings: vSettings, emails: vEmails, sweeps: vSweeps })[V.view](); } catch (e) { console.error(e); return `<p class="card err">${esc(e.message)}</p>`; } }
function coverage(v) { const l = P.latest(S.obs, v.id); return { n: Object.keys(l.prices).length, visited: l.visited, last: l.lastAt }; }

/* ---------- requests ---------- */
function vRequests() {
  const list = S.requests.filter(r => !S.area || r.area_id === S.area.id), r = S.requests.find(x => x.id === V.req);
  return `<div class="split"><section class="card" style="padding:0;overflow:auto">${list.length ? `<table class="t"><thead><tr><th>Asked</th><th>Who</th><th>Café</th><th>Status</th></tr></thead><tbody>
    ${list.map(x => { const v = venue(x.venue_id); return `<tr class="click ${x.id === V.req ? "sel" : ""}" data-req="${x.id}"><td class="sm">${esc(ago(x.created_at))}</td><td><b>${esc(x.name)}</b><br><span class="xs mute">${esc(x.role || "")} · ${esc(x.email)}</span></td>
      <td>${esc(v ? v.name : x.venue_text || "Not said")}${v ? "" : ' <span class="chip warn">Not linked</span>'}</td><td><span class="chip ${x.status === "new" ? "warn" : x.status === "founding" ? "good" : ""}">${STATUS[x.status]}</span>${x.founding_interest && x.status !== "founding" ? '<br><span class="chip good">Wants the front desk</span>' : ""}</td></tr>`; }).join("")}</tbody></table>`
    : `<p class="mute" style="padding:16px">No requests yet. They arrive from the area page.</p>`}</section><aside class="panel">${r ? reqPanel(r) : `<div class="card"><p class="mute">Choose a request.</p></div>`}</aside></div>`;
}
function reqPanel(r) {
  const v = venue(r.venue_id);
  let h = `<div class="card"><h2 style="margin:0 0 4px">${esc(r.name)}</h2><p class="sm mute">${esc(r.role || "")} · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>${r.phone ? ` · ${esc(r.phone)}` : ""}</p>
    ${r.message ? `<p>“${esc(r.message)}”</p>` : ""}${r.founding_interest ? `<p class="chip good">Wants the front desk</p>${r.founding_message ? `<p class="sm">“${esc(r.founding_message)}”</p>` : ""}` : ""}
    <label class="f"><span>Their café</span><select data-rq="venue_id"><option value="">${esc(r.venue_text || "Choose")}</option>${S.venues.filter(x => x.included).sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.id}" ${x.id === r.venue_id ? "selected" : ""}>${esc(x.name)} (${esc(x.postcode || "")})</option>`).join("")}</select></label>
    <label class="f"><span>Status</span><select data-rq="status">${Object.entries(STATUS).map(([k, t]) => `<option value="${k}" ${r.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></label>
    <label class="f"><span>Your notes</span><textarea data-rq="admin_notes">${esc(r.admin_notes || "")}</textarea></label>`;
  if (!v) h += `<p class="sm mute">Link the request to a café to build their report. If it's not on the list, add it under Cafés.</p>`;
  else if (v.lat == null) h += `<p class="sm err">This café has no location yet. Open it under Cafés and find its location.</p>`;
  else {
    const c = coverage(v);
    h += `<p class="sm">${c.n ? `We have ${c.n} of their prices` : `<span class="err">We have none of their prices yet.</span> Record their menu first`}${c.visited ? ", and a visit" : ""}.</p>
      <div class="row"><button class="btn" data-act="build">${r.report ? "Rebuild the report" : "Build the report"}</button>${r.report ? `<a class="btn q" href="${esc(reportUrl(r.token))}" target="_blank" rel="noopener">Open it</a>` : ""}</div>`;
    if (r.report) h += `<p class="xs mute" style="margin-top:8px">Saved ${fmtD(r.report_at)}.</p><div class="row"><button class="btn sm" data-act="emailreport">Email them the report</button><button class="btn q sm" data-act="copylink">Copy their link</button><a class="btn q sm" href="${esc(mailto(r, v))}">Email it yourself</a></div>`;
    const mb = r.owner_state && r.owner_state.menuBoard, mbUsed = mb && S.obs.some(o => o.venueId === r.venue_id && o.source === "owner" && o.at === mb.at && (o.notes || "").startsWith("Their menu board"));
    if (mb && r.venue_id) h += `<div class="card" style="margin:12px 0;background:var(--tint)"><p class="sm" style="margin:0 0 6px"><b>They sent their menu board</b> on ${fmtD(mb.at)}: ${Object.entries(mb.prices || {}).map(([k, p]) => `${esc((P.ITEM[k] || {}).t || k)} £${(+p).toFixed(2)}`).join(", ")}.</p>${mbUsed ? `<span class="chip good">Added to their prices</span>` : `<button class="btn sm" data-act="usemenu">Use these prices</button>`}</div>`;
    h += `<div class="row" style="margin-top:10px"><a class="btn q sm" href="${esc(ownerUrl(r.token))}" target="_blank" rel="noopener">Their Patch home</a>${r.owner_state ? `<button class="btn q sm" data-act="briefing">This week's briefing as an email</button>` : ""}</div>`;
  }
  return h + `</div>${V.draft && V.draft.id === r.id ? draftPanel() : ""}`;
}
function mailto(r, v) {
  const first = (r.name || "").split(/\s+/)[0] || "there";
  const body = `Hi ${first},\n\nHere's your free Patch report for ${v.name}: how you compare with the 10 cafés nearest you, item by item, and a calculator to see where you could save or charge more.\n\n${reportUrl(r.token)}\n\nIt's private: no other café sees your figures.\n\nIf you'd like to be found by AI too, with enquiries straight to your WhatsApp, there's a button at the end of the report. Setup is free and there's no contract.\n\nThanks`;
  return `mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent("Your Patch report for " + v.name)}&body=${encodeURIComponent(body)}`;
}

// A report is a snapshot you check before it's saved: nothing reaches the owner until you press Save.
function buildReport(r) {
  const v = venue(r.venue_id), pos = P.position(v, S.venues, S.obs, 10), area = P.areaStats(S.venues, S.obs);
  const nearV = pos.near.map(x => x.v);
  const snap = { at: new Date().toISOString(), area: { name: S.area.name, slug: S.area.slug, sector: S.area.sector || "cafe" },
    venue: { name: v.name, address: v.address, postcode: v.postcode, hygiene: v.hygiene, hygieneDate: v.hygieneDate, hours: v.hours || null },
    quality: pos.quality, me: { scores: pos.me.scores, visited: pos.me.visited, lastAt: pos.me.lastAt },
    near: pos.near.map(x => ({ name: x.v.name, d: x.d, hygiene: x.v.hygiene, kind: x.v.kind })),
    items: pos.items.map(i => ({ k: i.k, t: i.t, mine: i.mine, n: i.n, median: i.median, low: i.low, high: i.high, diff: i.diff, cheaperThan: i.cheaperThan, peers: i.peers })),
    areaScores: { scores: area.scores, wifi: area.wifi, cardOnly: area.cardOnly, visited: area.visited },
    nearScores: P.SCORES.map(s => ({ k: s.k, t: s.t, unit: s.unit, median: P.median(nearV.map(x => +P.latest(S.obs, x.id).scores[s.k]).filter(x => !isNaN(x))) })),
    calendar: P.calendarFor(S.area.calendar || [], (v.postcode || "").split(" ")[0], null, 56), salesCalendar: (S.area.calendar || []), profile: S.area.profile || null,
    costs: S.area.costs || [], gaps: P.hoursGaps(nearV), newNearby: P.newNearby(v, S.venues, 1).map(x => ({ name: x.v.name, d: x.d, postcode: x.v.postcode })), bench: bench() };
  snap.actions = draftActions(snap);
  return snap;
}
function draftActions(s) {
  const a = [];
  s.items.filter(i => i.diff != null && i.diff <= -0.2).sort((x, y) => x.diff - y.diff).slice(0, 3).forEach(i => a.push(`Your ${i.t.toLowerCase()} is ${money(-i.diff)} below the nearby average of ${money(i.median)}. There's room to raise it and still be competitive.`));
  s.items.filter(i => i.diff != null && i.diff >= 0.3).slice(0, 1).forEach(i => a.push(`Your ${i.t.toLowerCase()} is ${money(i.diff)} above the nearby average. Make sure the menu says why: the beans, the bake, the portion.`));
  const g = s.gaps, h = s.venue.hours;
  if (g && g.before8 <= 30 && !(h && h.mon && h.mon[0] && h.mon[0] <= "08:00")) a.push(`Only ${g.before8}% of the cafés near you open before 8am on weekdays. An earlier start could catch commuters and school runs.`);
  if (g && g.sunday <= 40 && !(h && h.sun)) a.push(`Only ${g.sunday}% of the cafés near you open on Sundays.`);
  if (s.newNearby.length) a.push(`${s.newNearby.length} place${s.newNearby.length > 1 ? "s" : ""} within a mile ${s.newNearby.length > 1 ? "are" : "is"} new or waiting for a first hygiene inspection: ${s.newNearby.slice(0, 3).map(x => x.name).join(", ")}.`);
  if (/^[0-4]$/.test(s.venue.hygiene || "")) a.push(`Your hygiene rating is ${s.venue.hygiene}. Most cafés near you are 5. Once the issues are fixed, you can ask the council to re-inspect.`);
  const missing = s.items.filter(i => i.mine == null && i.n >= 3).map(i => i.t.toLowerCase());
  if (missing.length) a.push(`We couldn't find your prices for: ${missing.slice(0, 5).join(", ")}. Send us your menu for a fuller comparison.`);
  return a.slice(0, 6);
}
function draftPanel() {
  const s = V.draft.snap, priced = s.items.filter(i => i.mine != null && i.median != null);
  return `<div class="card"><h3>Check before saving</h3><p class="sm">${s.near.length} nearest cafés, from ${s.near[0] ? s.near[0].d : "?"} to ${s.near.length ? s.near[s.near.length - 1].d : "?"} miles. ${priced.length} items compared.</p>
    <table class="t"><thead><tr><th>Item</th><th class="n">Them</th><th class="n">Nearby</th><th class="n">Diff</th></tr></thead><tbody>${priced.map(i => `<tr><td>${esc(i.t)}</td><td class="n">${money(i.mine)}</td><td class="n">${money(i.median)}</td><td class="n">${i.diff > 0 ? "+" : ""}${i.diff.toFixed(2)}</td></tr>`).join("")}</tbody></table>
    <label class="f" style="margin-top:12px"><span>Suggested actions (one per line). Edit freely: these go in the report.</span><textarea id="actions" style="min-height:180px">${esc(s.actions.join("\n"))}</textarea></label>
    <div class="row"><button class="btn" data-act="savereport">Save the report</button><button class="btn q" data-act="canceldraft">Cancel</button></div></div>`;
}

/* ---------- record a visit or menu ---------- */
function vRecord() {
  const R = V.rec, v = venue(R.venue), last = v ? P.latest(S.obs, v.id) : null;
  const list = S.venues.filter(x => x.included).sort((a, b) => a.name.localeCompare(b.name));
  const scoreBtns = (k, n) => `<span class="seg">${Array.from({ length: n }, (_, i) => i + 1).map(x => `<button type="button" data-score="${k}" data-v="${x}" aria-pressed="${R.scores[k] === x}">${x}</button>`).join("")}</span>`;
  const yn = k => `<span class="seg"><button type="button" data-score="${k}" data-v="true" aria-pressed="${R.scores[k] === true}">Yes</button><button type="button" data-score="${k}" data-v="false" aria-pressed="${R.scores[k] === false}">No</button></span>`;
  let h = `<div class="split"><section class="card"><h2>Record a visit or menu</h2><p class="sm"><a class="btn q sm" href="visit.html${D.DEMO ? "?demo=1" : ""}${v ? (D.DEMO ? "&" : "?") + "v=" + encodeURIComponent(v.id) : ""}">Open the visit form</a> <span class="mute">Made for your phone: Google details, photos, every score, and where the visit ranks. Use this page for menus and websites.</span></p>
    <label class="f"><span>Café</span><input id="recCafe" list="recList" autocomplete="off" value="${v ? esc(v.name + " (" + (v.postcode || "") + ")") : ""}" placeholder="Start typing"><datalist id="recList">${list.map(x => `<option value="${esc(x.name)} (${esc(x.postcode || "")})">`).join("")}</datalist></label>
    <div class="row"><label class="f" style="flex:0 0 170px"><span>Date</span><input type="date" id="recAt" value="${esc(R.at || today())}"></label>
    <div><span class="sm" style="display:block;font-weight:600;margin:0 0 4px">From</span><span class="seg">${[["visit", "A visit"], ["menu", "Menu or photo"], ["website", "Website"], ["owner", "The owner"]].map(([k, t]) => `<button type="button" data-src="${k}" aria-pressed="${R.source === k}">${t}</button>`).join("")}</span></div></div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><h3 style="margin:0">Prices (as charged, VAT included)</h3><label class="btn q sm" style="position:relative;overflow:hidden">${V.rec.reading ? "Reading…" : "Read them from a photo"}<input type="file" accept="image/*" data-menuphoto="1" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Read prices from a menu photo"></label></div>${V.rec.readNote ? `<p class="sm mute">${esc(V.rec.readNote)}</p>` : ""}<div class="prices">${P.ITEMS.map(i => `<label class="f"><span>${esc(i.t)}</span><input inputmode="decimal" data-price="${i.k}" value="${R.prices[i.k] ?? ""}" placeholder="${last && last.prices[i.k] != null ? last.prices[i.k].toFixed(2) : "£"}"></label>`).join("")}</div>`;
  if (R.source === "visit") h += `<h3>What you found</h3>
    <div class="scorerow"><span>Minutes to be served</span><input type="number" min="0" max="60" data-scorenum="wait" value="${R.scores.wait ?? ""}" style="width:80px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card)"></div>
    <div class="scorerow"><span>Cleanliness</span>${scoreBtns("clean", 5)}</div><div class="scorerow"><span>Friendliness</span>${scoreBtns("friendly", 5)}</div><div class="scorerow"><span>Seats free</span>${scoreBtns("seats", 5)}</div>
    <div class="scorerow"><span>Wifi</span>${yn("wifi")}</div><div class="scorerow"><span>Cards only</span>${yn("card_only")}</div>`;
  h += `<details style="margin:10px 0"${R.hours ? " open" : ""}><summary><b>Opening hours</b> <span class="sm mute">(optional, from the door or Google)</span></summary><div class="hrs" style="margin-top:8px">${P.DAYS.map(d => { const x = (R.hours || (v && v.hours) || {})[d];
    return `<span>${P.DAYNAME[d]}</span><input type="time" data-hr="${d}.0" value="${x ? x[0] : ""}"><input type="time" data-hr="${d}.1" value="${x ? x[1] : ""}"><label class="sm"><input type="checkbox" data-closed="${d}" ${x === null ? "checked" : ""}> Closed</label>`; }).join("")}</div></details>
    <label class="f"><span>Notes (optional)</span><textarea id="recNotes" maxlength="1000"></textarea></label>
    <p class="err" id="recErr"></p><button class="btn big" data-act="saverec">Save</button></section>
    <aside class="panel"><div class="card"><h3>Coverage</h3>${coverageBox()}</div>${v ? `<div class="card"><h3>${esc(v.name)}: what we have</h3>${obsList(v)}</div>` : ""}</aside></div>`;
  return h;
}
function coverageBox() {

const confirmIt = () => true;
function renderKeep() { const y = scrollY; render(); scrollTo(0, y); }
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if (t.id === "areaSel") { await loadArea(t.value); V.req = null; V.draft = null; return render(); }

  if (d.kind) { const v = venue(d.kind); v.kind = t.value; try { await DB.updVenue(v.id, { kind: v.kind }); } catch (x) { toast(x.message); } return; }

document.addEventListener("input", e => {

function readHours() {
  const h = {}; let any = false;
  P.DAYS.forEach(d => { const c = document.querySelector(`[data-closed="${d}"]`), a = document.querySelector(`[data-hr="${d}.0"]`), b = document.querySelector(`[data-hr="${d}.1"]`);
    if (c && c.checked) { h[d] = null; any = true; } else if (a && b && a.value && b.value) { h[d] = [a.value, b.value]; any = true; } });
  return any ? h : null;
}
// A menu photo, for the café being recorded: stored with the visit photos, read by Claude, prices filled in to check.
async function readMenuPhoto(file) {
  const R = V.rec, v = venue(R.venue); if (!v) return toast("Choose the café first");
  if (D.DEMO) { R.readNote = "In the live version, Claude reads the photo and fills these in for you to check."; return render(); }
  R.reading = true; R.readNote = null; render();
  try { const blob = await new Promise((ok, bad) => { const u = URL.createObjectURL(file), img = new Image(); img.onload = () => { const k = Math.min(1, 2000 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(ok, "image/jpeg", 0.85); }; img.onerror = () => bad(new Error("That isn't a photo we can read")); img.src = u; });
    const path = `menus/${v.id}/${today()}-${Date.now()}.jpg`; await DB.uploadPhoto(path, blob);
    const tok = await DB.token(), r = await fetch("/api/read-menu", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok }, body: JSON.stringify({ bucket: "visit-photos", path }) }), j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || "Couldn't read it");
    Object.assign(R.prices, j.prices); R.menuPhoto = path; R.readNote = `${Object.keys(j.prices).length} prices read${j.legible && j.legible !== "good" ? ` (board ${j.legible} legible)` : ""}${j.notes ? ": " + j.notes : ""}. Check them, then save.`;
  } catch (e) { R.readNote = "Not read: " + e.message; }
  R.reading = false; render();
}
async function saveRec() {
  const err = $("#recErr"), R = V.rec, v = venue(R.venue);
  if (!v) { err.textContent = "Choose the café first."; return; }
  const prices = {}; Object.entries(R.prices).forEach(([k, x]) => { const n = parseFloat(String(x).replace(/[£,\s]/g, "")); if (!isNaN(n) && n > 0 && n < 60) prices[k] = Math.round(n * 100) / 100; });
  const scores = {}; Object.entries(R.scores).forEach(([k, x]) => { if (x !== undefined && x !== "") scores[k] = x; });
  const hours = readHours();
  if (!Object.keys(prices).length && !Object.keys(scores).length && !hours) { err.textContent = "Add at least one price, score or opening time."; return; }
  try {
    if (Object.keys(prices).length || Object.keys(scores).length) S.obs.push(await DB.addObservation({ venue_id: v.id, at: $("#recAt").value || today(), source: R.source, prices, scores, notes: $("#recNotes").value.trim() || null, by_name: ME.name || null, photos: R.menuPhoto ? [{ bucket: "visit-photos", path: R.menuPhoto, tag: "Menu board" }] : [] }));
    if (hours) { Object.assign(v, await DB.updVenue(v.id, { hours: Object.assign({}, v.hours || {}, hours) })); }
    toast(`Saved ${v.name}`); V.rec = { venue: null, source: R.source, scores: {}, prices: {}, hours: null, at: $("#recAt").value }; render();
  } catch (x) { err.textContent = x.message; }
}
async function saveEdit(id) {
  const g = k => $("#" + k).value.trim(), num = x => (x === "" ? null : +x);
  const p = { name: g("e-name"), address: g("e-addr") || null, postcode: g("e-pc").toUpperCase() || null, lat: num(g("e-lat")), lng: num(g("e-lng")), google_rating: num(g("e-g")), website: g("e-web") || null, notes: g("e-notes") || null };

  try { if (id) Object.assign(venue(id), await DB.updVenue(id, p)); else S.venues.push(...(await DB.addVenues([Object.assign({ area_id: S.area.id, included: true, kind: "independent" }, p)])));
    $("#modal").remove(); toast("Saved"); render(); } catch (x) { $("#e-err").textContent = x.message; }
}
async function loadFsa() {
  try { const r = await fetch(`data/${S.area.slug}.json`); if (!r.ok) throw new Error("There's no hygiene list for this area yet."); const j = await r.json();
    const have = new Set(S.venues.map(v => v.fsa_id)); const rows = j.venues.filter(v => !have.has(v.fsaId)).map(v => ({ area_id: S.area.id, fsa_id: v.fsaId, name: v.name, address: v.address, postcode: v.postcode, lat: v.lat, lng: v.lng, kind: v.kind, included: v.included, hygiene: v.hygiene, hygiene_date: v.hygieneDate }));
    if (!rows.length) { toast("Already loaded"); return; }
    S.venues.push(...(await DB.addVenues(rows))); toast(`Loaded ${rows.length} food businesses`); render();
  } catch (x) { toast(x.message); }
}

// Menu prices found online (delivery apps), stored as "delivery" so they guide visitors but never count in benchmarks.
async function loadMenus() {
  try { const r = await fetch(`data/${S.area.slug}-menus.json`); if (!r.ok) throw new Error("No online menus saved for this area yet."); const j = await r.json();
    let added = 0, missing = [];
    for (const m of j.menus) { const v = S.venues.find(x => x.fsa_id === m.fsaId); if (!v) { missing.push(m.name); continue; }
      if (S.obs.some(o => o.venueId === v.id && o.source === "delivery" && o.at === j.read)) continue;
      const notes = `${m.channel} menu, ${m.url}` + (m.notes ? ". " + Object.entries(m.notes).map(([k, t]) => `${(P.ITEM[k] || {}).t || k}: ${t}`).join("; ") : "");
      S.obs.push(await DB.addObservation({ venue_id: v.id, at: j.read, source: "delivery", prices: m.prices, scores: {}, notes: notes.slice(0, 1000), by_name: "Online menu" })); added++; }
    for (const c of j.checkOnVisit || []) { const v = S.venues.find(x => x.fsa_id === c.fsaId); if (v && !(v.notes || "").includes(c.why)) Object.assign(v, await DB.updVenue(v.id, { notes: ((v.notes ? v.notes + " " : "") + c.why).slice(0, 1000) })); }
    toast(added ? `Loaded online prices for ${added} café${added > 1 ? "s" : ""}${missing.length ? `. Load the hygiene list first for ${missing.length} more` : ""}` : missing.length ? "Load the hygiene list first" : "Already loaded"); render();
  } catch (x) { toast(x.message); }
}
