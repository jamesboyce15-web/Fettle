<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Coordinator · Fettle</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--brand:#173f35;--brand2:#215a4b;--amber:#f2a900;--bg:#f3f5f2;--card:#fff;--ink:#1c2522;--mute:#5d6964;--line:#dde3df;
  --g:#2e7d4f;--gb:#e6f2ea;--a:#8a5a00;--ab:#fff3d6;--r:#b3261e;--rb:#fde7e5;--blue:#1f5f99;--bb:#e7f0f9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--brand2)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* layout */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--brand);color:#e9f1ed;padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;color:#fff;text-decoration:none;padding:4px 8px 14px}
.brand small{font-weight:500;font-size:.75rem;opacity:.75;display:block;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:10px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.08)}
.nav[aria-current=page]{background:rgba(255,255,255,.16);color:#fff}
.nav .n{margin-left:auto;background:var(--amber);color:#1c2522;border-radius:999px;font-size:.75rem;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:.82rem;opacity:.85;padding:8px 10px}
.side .foot button{background:none;border:0;color:#fff;text-decoration:underline;padding:0}
.main{padding:22px 26px 60px;min-width:0}
.demo{background:var(--ab);color:#5a3d00;border:1px solid #f0d38a;border-radius:10px;padding:8px 12px;margin:0 0 14px;font-size:.9rem}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--brand);letter-spacing:-.01em}
h2{font-size:1.08rem;margin:0 0 10px;color:var(--brand)}
h3{font-size:.98rem;margin:0 0 8px}
.lead{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute)}.sm{font-size:.86rem}.xs{font-size:.78rem}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;border-left:5px solid var(--line)}
button.kpi:hover{border-color:#b9c4be}
.kpi b{display:block;font-size:1.8rem;line-height:1.1;color:var(--brand)}
.kpi span{font-size:.85rem;color:var(--mute)}
.kpi.warn{border-left-color:var(--amber)}.kpi.bad{border-left-color:var(--r)}.kpi.good{border-left-color:var(--g)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--brand2)}
.btn.q{background:#fff;color:var(--brand);border:1px solid #c9d3ce}
.btn.q:hover{background:#f3f6f4}
.btn.amber{background:var(--amber);color:#1c2522}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{background:#fff;color:var(--r);border:1px solid #efc2bd}
.link{background:none;border:0;color:var(--brand2);text-decoration:underline;padding:0}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:#f8faf9;position:sticky;top:0}
.t tbody tr{cursor:pointer}.t tbody tr:hover{background:#f6f9f7}
.t tr.sel{background:#eaf2ee}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;white-space:nowrap;background:#eef1ef;color:var(--mute)}
.chip.ok{background:var(--gb);color:var(--g)}.chip.thin{background:var(--ab);color:var(--a)}.chip.gap{background:var(--rb);color:var(--r)}.chip.info{background:var(--bb);color:var(--blue)}
.bands{display:inline-flex;gap:4px}
.bd{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff}
.bd.ok{background:var(--g)}.bd.thin{background:#d49a00}.bd.gap{background:var(--r)}.bd.none{background:#cfd6d2}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--mute)}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .chip{margin-left:4px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list li:last-child{border-bottom:0}
.ic{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:#eef1ef;color:var(--mute)}
.ic.r{background:var(--rb);color:var(--r)}.ic.a{background:var(--ab);color:var(--a)}.ic.g{background:var(--gb);color:var(--g)}.ic.b{background:var(--bb);color:var(--blue)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{position:sticky;top:16px}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:0 0 12px}
dl.kv dt{color:var(--mute);font-size:.86rem}dl.kv dd{margin:0}
/* forms */
.f{display:block;margin:0 0 10px}
.f>span{display:block;font-size:.82rem;color:var(--mute);margin:0 0 3px;font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid #cbd4cf;border-radius:8px;padding:7px 9px;background:#fff}
.f textarea{min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9cc3b3;border-color:#7fae9a}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 14px}
.yn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #e4e9e6}
.yn>span{font-size:.92rem}
.seg{display:inline-flex;border:1px solid #cbd4cf;border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{background:#fff;border:0;padding:4px 10px;font-size:.84rem;border-left:1px solid #cbd4cf}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.multi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.multi label{border:1px solid #cbd4cf;border-radius:999px;padding:3px 10px;font-size:.84rem;background:#fff;cursor:pointer}
.multi input{margin:0 5px 0 0}
.multi label:has(input:checked){background:var(--gb);border-color:#9cc3b3}
.ynwrap{columns:2;column-gap:24px}
.ynwrap .yn{break-inside:avoid}
.hcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;background:#fbfcfb}
.htable{width:100%;border-collapse:collapse;font-size:.88rem}
.htable th{font-size:.72rem;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px;font-weight:600}
.htable td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
.htable input[type=text],.htable input[type=number],.htable select{width:100%;border:1px solid #cbd4cf;border-radius:6px;padding:4px 6px;min-width:60px}
.htable input[type=checkbox]{width:18px;height:18px}
.htable td.c{text-align:center}
/* call */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.step{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;color:var(--mute)}
.step[aria-current=step]{background:var(--brand);color:#fff;border-color:var(--brand)}
.step.done{color:var(--g);border-color:#a9d3b8}
.script{background:#f3f7f5;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.script b{color:var(--brand)}
.timer{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;color:var(--brand)}
.timer.over{color:var(--r)}
.cov{width:100%;border-collapse:collapse;font-size:.88rem}
.cov th,.cov td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.cov th{font-size:.72rem;text-transform:uppercase;color:var(--mute)}
.why{font-size:.78rem;color:var(--mute);display:block}
.saved{font-size:.8rem;color:var(--mute)}
.find{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:0 0 8px;font-size:.88rem}
.find.high{border-color:var(--r)}
.empty{color:var(--mute);padding:18px;text-align:center;border:1px dashed #cdd5d0;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(20,30,26,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.signin{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.preview{background:var(--bg);border-radius:14px;padding:16px}
@media(max-width:1100px){.split{grid-template-columns:1fr}.panel{position:static}.kpis{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}.brand{padding:4px 8px}.side .foot{margin:0;width:100%}.nav{width:auto}.main{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}.ynwrap{columns:1}dl.kv{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<div id="root"><p style="padding:24px">Loading…</p></div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="call-kit.js"></script>
<script src="call-demo.js"></script>
<script src="plan-view.js"></script>
<script>
(function () {
"use strict";
const K = window.FettleCall, CFG = window.FETTLE_CONFIG || {}, Q = new URLSearchParams(location.search);
const DEMO = Q.has("demo") || !CFG.supabaseUrl || !!window.FETTLE_FAKE_DB;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
const short = () => Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const fmtD = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); };
const fmtDT = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const ago = s => { const m = (Date.now() - new Date(s)) / 60000; if (m < 60) return Math.max(1, Math.round(m)) + " min ago"; if (m < 1440) return Math.round(m / 60) + " h ago"; return Math.round(m / 1440) + " days ago"; };
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
const toISOlocal = s => { if (!s) return ""; const d = new Date(s); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (n, from) => { const d = from ? new Date(from) : new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); }
const planUrl = (tok, extra) => DEMO ? `plan.html?demo=1&t=${encodeURIComponent(tok)}${extra || ""}`
  : `${location.protocol === "file:" ? "plan.html" : location.origin + "/plan"}?t=${encodeURIComponent(tok)}${extra || ""}`;

const REQ_ST = { new: "New", contacted: "Contacted", scheduled: "Call booked", done: "Call done", declined: "Not going ahead" };
const CL_ST = { call: "In call", plan_sent: "Plan sent", active: "Active", paused: "Paused", closed: "Closed" };
const KIT_ST = [["recommended", "Recommended"], ["approved", "Approved"], ["ordered", "Ordered"], ["delivered", "Delivered"]];
const EV_KIND = [["weather", "Weather warning"], ["flood", "Flood"], ["power", "Power cut"], ["water", "Water outage"], ["health", "Health alert"], ["cyber", "Cyber threat"], ["scam", "Scams"], ["funding", "Funding"], ["resource", "New local help"], ["other", "Other"]];
const SOURCES = [
  ["Met Office warnings", "https://weather.metoffice.gov.uk/warnings-and-advice/uk-warnings"],
  ["Flood warnings (Environment Agency)", "https://check-for-flooding.service.gov.uk/"],
  ["Power cuts (105)", "https://www.powercut105.com/"],
  ["UKHSA heat and cold alerts", "https://ukhsa-dashboard.data.gov.uk/weather-health-alerts"],
  ["NCSC news", "https://www.ncsc.gov.uk/section/keep-up-to-date/ncsc-news"],
  ["Action Fraud", "https://www.actionfraud.police.uk/"],
];

/* ===================== data ===================== */
function fakeDB() {
  const D = window.FETTLE_FAKE_DB || FettleDemo, S = { coordinators: clone(D.coordinators), requests: clone(D.requests), clients: clone(D.clients), messages: clone(D.messages), events: clone(D.events) };
  let me = clone(D.ME);
  const upd = (arr, key, id, p) => { const r = S[arr].find(x => x[key] === id); Object.assign(r, clone(p)); return clone(r); };
  return { demo: true, S,
    async me() { return me; }, async signIn() {}, async signOut() { me = null; },
    async loadAll() { return clone(S); },
    async updRequest(id, p) { return upd("requests", "id", id, p); },
    async newClient(row) { const r = Object.assign({ id: uid(), share_token: "demo-" + short(), status: "call", data: {}, private: {}, created_at: new Date().toISOString(), updated_at: new Date().toISOString() }, clone(row)); S.clients.unshift(r); return clone(r); },
    async updClient(id, p) { return upd("clients", "id", id, Object.assign({}, p, { updated_at: new Date().toISOString() })); },
    async addMessage(row) { const r = Object.assign({ id: uid(), at: new Date().toISOString(), seen: false }, clone(row)); S.messages.unshift(r); return clone(r); },
    async updMessage(id, p) { return upd("messages", "id", id, p); },
    async saveEvent(row) { if (row.id && S.events.some(e => e.id === row.id)) return upd("events", "id", row.id, row); const r = Object.assign({ id: uid(), created_at: new Date().toISOString(), contacted: {}, closed: false }, clone(row)); S.events.unshift(r); return clone(r); },
    async updMe(id, p) { Object.assign(me, p); return clone(me); },
  };
}
function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function liveDB() {
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const ok = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  const noId = o => { const c = Object.assign({}, o); if (!c.id) delete c.id; return c; };
  return { demo: false,
    async me() { const { data } = await sb.auth.getSession(); const s = data && data.session; if (!s) return null;
      const r = await sb.from("coordinators").select("*").eq("user_id", s.user.id).maybeSingle(); return r.data || { notCoordinator: true, email: s.user.email }; },
    async signIn(email, password) { const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw new Error(/invalid/i.test(r.error.message) ? "That email and password don't match." : r.error.message); },
    async signOut() { await sb.auth.signOut(); },
    async loadAll() {
      const [co, rq, cl, ms, ev] = await Promise.all([sb.from("coordinators").select("*"), sb.from("call_requests").select("*").order("created_at", { ascending: false }).limit(500),
        sb.from("call_clients").select("*").order("updated_at", { ascending: false }).limit(1000), sb.from("call_messages").select("*").order("at", { ascending: false }).limit(500),
        sb.from("watch_events").select("*").order("created_at", { ascending: false }).limit(200)]);
      return { coordinators: ok(co), requests: ok(rq), clients: ok(cl), messages: ok(ms), events: ok(ev) };
    },
    async updRequest(id, p) { return ok(await sb.from("call_requests").update(p).eq("id", id).select().single()); },
    async newClient(row) { return ok(await sb.from("call_clients").insert(row).select().single()); },
    async updClient(id, p) { return ok(await sb.from("call_clients").update(p).eq("id", id).select("id,updated_at").single()); },
    async addMessage(row) { return ok(await sb.from("call_messages").insert(row).select().single()); },
    async updMessage(id, p) { return ok(await sb.from("call_messages").update(p).eq("id", id).select().single()); },
    async saveEvent(row) { return row.id ? ok(await sb.from("watch_events").update(noId(row)).eq("id", row.id).select().single()) : ok(await sb.from("watch_events").insert(noId(row)).select().single()); },
    async updMe(id, p) { return ok(await sb.from("coordinators").update(p).eq("user_id", id).select().single()); },
  };
}

/* ===================== state ===================== */
let DB, ME, S = { coordinators: [], requests: [], clients: [], messages: [], events: [] };
const V = { view: "today", client: null, tab: "call", step: 0, req: null, ev: null, reqTab: "new", q: "", cf: "all", timer: null, timerAt: 0 };
const client = id => S.clients.find(c => c.id === id);
const C = () => client(V.client);
const geoOf = c => (c.data && c.data.geo) || {};
const coordName = id => (S.coordinators.find(x => x.user_id === id) || {}).name || "";

/* ===================== routing ===================== */
function nav(view, extra) { Object.assign(V, { view }, extra || {}); if (view !== "client") stopTimer(); render(); scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + view + (V.client && view === "client" ? "/" + V.client : "")); } catch (e) {} }

/* ===================== shell ===================== */
function counts() {
  const newReq = S.requests.filter(r => r.status === "new").length;
  const unread = S.messages.filter(m => m.kind === "family" && !m.seen).length;
  const openEv = S.events.filter(e => !e.closed).length;
  return { newReq, unread, openEv };
}
function render() {
  if (!ME) return;
  const n = counts();
  const item = (v, t, badge) => `<button class="nav" data-nav="${v}" ${V.view === v || (v === "clients" && V.view === "client") ? 'aria-current="page"' : ""}>${t}${badge ? `<span class="n">${badge}</span>` : ""}</button>`;
  $("#root").innerHTML = `<div class="shell"><aside class="side">
    <a class="brand" href="#" data-nav="today"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#f6f7f4"/><path d="M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z" fill="none" stroke="#173f35" stroke-width="2" stroke-linejoin="round"/><path d="M16 14.5c1.9 1.7 2.8 3.2 2.8 4.6a2.8 2.8 0 0 1-5.6 0c0-1.4.9-2.9 2.8-4.6z" fill="#f2a900"/></svg><span>fettle<small>Coordinator</small></span></a>
    ${item("today", "Today", n.unread || "")}${item("requests", "Call requests", n.newReq || "")}${item("clients", "Families")}${item("watch", "Watch", n.openEv || "")}${item("settings", "Settings")}
    <div class="foot">${esc(ME.name)}${ME.patch ? `<br><span class="xs">${esc(ME.patch)}</span>` : ""}<br><button data-act="signout">Sign out</button></div></aside>
    <main class="main" id="main">${DB.demo ? `<p class="demo"><b>Demo.</b> Made-up families. Changes last until you reload the page.</p>` : ""}${view()}</main></div>`;
  after();
}
function view() {
  try { return ({ today: vToday, requests: vRequests, clients: vClients, client: vClient, watch: vWatch, settings: vSettings })[V.view](); }
  catch (e) { console.error(e); return `<p class="card">Something went wrong showing this page: ${esc(e.message)}</p>`; }
}
function after() { if (V.view === "client") { rail(); tickTimer(); } }

/* ===================== helpers for families ===================== */
function bandWorst(c) {
  const cov = K.coverage(c.data || {}, geoOf(c)); if (!cov.length) return null;
  const rank = { gap: 2, thin: 1, ok: 0 }, out = {};
  K.BANDS.forEach(b => { out[b.k] = cov.reduce((w, r) => rank[r.bands[b.k].status] > rank[w] ? r.bands[b.k].status : w, "ok"); });
  return out;
}
function bandDots(c) { const w = bandWorst(c); if (!w) return `<span class="bands">${K.BANDS.map(b => `<span class="bd none" title="${b.name}: nobody marked as needing help">${b.name[0]}</span>`).join("")}</span>`;

const geoCache = (() => { try { return JSON.parse(localStorage.getItem("fettle-geo") || "{}"); } catch (e) { return {}; } })();
async function ensureGeo(c) {
  const d = c.data; d.geo = d.geo || {};
  const want = [...new Set([...(d.homes || []).map(h => h.district), ...(d.helpers || []).map(h => h.district)].map(K.normDistrict).filter(Boolean))].filter(x => !d.geo[x]);
  if (!want.length) return;
  let changed = false;
  for (const w of want) {
    if (geoCache[w]) { d.geo[w] = geoCache[w]; changed = true; continue; }
    if (DB.demo) continue;
    try { const r = await fetch("https://api.postcodes.io/outcodes/" + encodeURIComponent(w)); if (!r.ok) continue; const j = await r.json();
      if (j && j.result && j.result.latitude != null) { geoCache[w] = d.geo[w] = { lat: j.result.latitude, lng: j.result.longitude }; changed = true; } } catch (e) {}
  }
  try { localStorage.setItem("fettle-geo", JSON.stringify(geoCache)); } catch (e) {}
  if (changed) { save(c); if (V.view === "client" && V.client === c.id) { rail(); if (V.tab === "call" && V.step === 3) { const r = $("#reasons"); if (r) r.innerHTML = reasonsTable(c); } } }
}

/* --- Send plan --- */
function sendModal() {
  const c = C(), b = c.data.booker || {}, link = planUrl(c.share_token), who = K.vulnPeople(c.data).map(x => x.person.name).filter(Boolean).join(" and ") || "everyone";
  const body = `Hi ${(b.name || "").split(/\s+/)[0] || "there"},\n\nHere's the ${c.family_name} family plan from our call:\n${link}\n\nIt shows what to do in a short power cut, a storm that lasts a few days, and a national emergency, and who will help ${who} in each. The printed book is on its way.\n\nIf anything changes, use the "Something's changed" box at the bottom of the plan, or reply to this email.\n\n${ME.name}\nYour Fettle coordinator${ME.phone ? "\n" + ME.phone : ""}`;
  const subj = `The ${c.family_name} family plan`;
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Send the plan</h2><p class="sm mute">Check it over in the Family view first. Then send this from your own email.</p>
    <label class="f"><span>To</span><input value="${esc(b.email || "")}" readonly></label><label class="f"><span>Message</span><textarea id="sendbody" style="min-height:240px">${esc(body)}</textarea></label>
    <div class="row"><button class="btn q" data-act="copymsg">Copy message</button>${b.email ? `<a class="btn q" id="mailto" href="mailto:${esc(b.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}">Open in email</a>` : ""}<span class="sp"></span><button class="btn q" data-act="closemodal">Cancel</button><button class="btn amber" data-act="marksent">I've sent it</button></div></div>`;
  document.body.appendChild(m);
}
async function markSent() {
  const c = C(); c.status = c.status === "call" ? "plan_sent" : c.status; c.sent_at = new Date().toISOString(); c.next_review = c.next_review || addDays(365);
  c.data.call = c.data.call || {}; c.data.call.doneAt = c.data.call.doneAt || new Date().toISOString();
  try { await DB.updClient(c.id, { status: c.status, sent_at: c.sent_at, next_review: c.next_review, data: c.data });
    const r = S.requests.find(x => x.client_id === c.id); if (r && r.status !== "done") await updReq(r.id, { status: "done" });
    S.messages.unshift(await DB.addMessage({ client_id: c.id, kind: "system", body: `Plan sent to ${(c.data.booker || {}).name || "the family"}.`, author: ME.name }));
  } catch (e) { toast(e.message); }
  $("#modal") && $("#modal").remove(); toast("Marked as sent"); render();
}

/* ===================== Watch ===================== */
function affected(e) {
  const ds = (e.districts || []).map(K.normDistrict), all = ds.includes("ALL");
  return S.clients.filter(c => c.status !== "closed" && ((c.data || {}).homes || []).some(h => all || ds.includes(K.normDistrict(h.district))))
    .map(c => ({ c, risk: K.eventRisk(c.data || {}, e.band, geoOf(c)) })).sort((a, b) => b.risk - a.risk);
}
function vWatch() {
  const ev = S.events.find(x => x.id === V.ev), open = S.events.filter(e => !e.closed), closed = S.events.filter(e => e.closed);
  return `<h1>Watch</h1><p class="lead">Log what's coming, from official and public sources, and work through the families it affects, highest risk first. Never research individuals.</p>
  <div class="split"><div>
    ${ev ? evDetail(ev) : ""}
    <section class="card"><h2>Log something coming</h2><div class="fg">
      <label class="f" style="grid-column:1/-1"><span>What</span><input id="ev-title" maxlength="140" placeholder="Amber wind warning: Greater Manchester, Saturday"></label>
      <label class="f"><span>Kind</span><select id="ev-kind">${EV_KIND.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
      <label class="f"><span>Band</span><select id="ev-band">${K.BANDS.map(b => `<option value="${b.k}" ${b.k === "a" ? "selected" : ""}>${b.name}: ${b.what.toLowerCase()}</option>`).join("")}</select></label>
      <label class="f"><span>From</span><input id="ev-starts" type="date"></label><label class="f"><span>To</span><input id="ev-ends" type="date"></label>
      <label class="f" style="grid-column:1/-1"><span>Postcode areas, or ALL for every family</span><input id="ev-districts" placeholder="OL11, OL12, M14"></label>
      <label class="f" style="grid-column:1/-1"><span>Source link</span><input id="ev-source" type="url" placeholder="https://"></label>
      <label class="f" style="grid-column:1/-1"><span>What it means for plans</span><textarea id="ev-note" maxlength="1000"></textarea></label></div>
      <button class="btn" data-act="logev">Log it</button></section>
    <section class="card"><h2>Flood warnings near your families</h2><p class="sm mute">Live from the Environment Agency, within about 10 km of each family's home.</p><button class="btn q" data-act="floods">Check now</button><div id="floods" style="margin-top:10px"></div></section>
  </div><aside class="panel"><section class="card"><h2>On the watch list</h2>${open.length ? `<ul class="list">${open.map(e => `<li><span class="ic ${e.band}">${e.band.toUpperCase()}</span><span class="sp"><button class="link" data-open-ev="${e.id}">${esc(e.title)}</button><br><span class="xs mute">${esc((EV_KIND.find(x => x[0] === e.kind) || [, e.kind])[1])} · ${affected(e).length} families · ${Object.keys(e.contacted || {}).length} contacted</span></span></li>`).join("")}</ul>` : `<p class="mute sm">Nothing yet.</p>`}
    ${closed.length ? `<p class="xs mute" style="margin-top:10px">${closed.length} closed</p>` : ""}</section>
    <section class="card"><h2>Where to look</h2><ul class="list">${SOURCES.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul></section></aside></div>`;
}
function evDetail(e) {
  const list = affected(e), done = e.contacted || {}, res = ["funding", "resource"].includes(e.kind);
  return `<section class="card" id="evd"><div class="row"><span class="ic ${e.band}">${e.band.toUpperCase()}</span><h2 style="margin:0">${esc(e.title)}</h2><span class="sp"></span><button class="btn q sm" data-act="closeev">${e.closed ? "Reopen" : "Close"}</button></div>
  <p class="sm mute">${[e.starts && "From " + fmtD(e.starts), e.ends && "to " + fmtD(e.ends), (e.districts || []).join(", ")].filter(Boolean).join(" · ")}${safeUrl(e.source) ? ` · <a href="${esc(safeUrl(e.source))}" target="_blank" rel="noopener">Source</a>` : ""}</p>${e.note ? `<p>${esc(e.note)}</p>` : ""}
  ${res ? `<p><button class="btn" data-act="addres">Add to these families' plans as "New near you"</button></p>` : ""}
  ${list.length ? `<table class="t"><thead><tr><th>Family</th><th>Needs someone</th><th>${K.BAND[e.band].name}</th><th>Contact</th><th>Contacted</th></tr></thead><tbody>${list.map(({ c, risk }) => {
    const cov = K.coverage(c.data, geoOf(c)), st = cov.map(r => r.bands[e.band].status), worst = st.includes("gap") ? "gap" : st.includes("thin") ? "thin" : st.length ? "ok" : "";
    const b = c.data.booker || {};
    return `<tr><td><button class="link" data-open-client="${c.id}">${esc(c.family_name)}</button><br><span class="xs mute">risk ${risk}</span></td><td>${esc(peopleNames(c) || "None marked")}</td>
    <td>${worst ? `<span class="chip ${worst}">${worst === "ok" ? "Covered" : worst === "thin" ? "No backup" : "Gap"}</span>` : ""}</td>
    <td class="sm">${esc(b.name || "")}${b.phone ? `<br><a href="tel:${esc(b.phone.replace(/\s/g, ""))}">${esc(b.phone)}</a>` : ""}${b.email ? `<br><a href="mailto:${esc(b.email)}">Email</a>` : ""}</td>
    <td><input type="checkbox" data-contacted="${c.id}" ${done[c.id] ? "checked" : ""} style="width:20px;height:20px" aria-label="Contacted ${esc(c.family_name)}">${done[c.id] ? `<span class="xs mute"> ${esc(fmtD(done[c.id]))}</span>` : ""}</td></tr>`; }).join("")}</tbody></table>` : `<p class="empty">No families in those areas.</p>`}</section>`;
}
async function logEvent() {
  const g = id => ($("#" + id).value || "").trim(), title = g("ev-title");
  if (!title) { toast("Say what's coming first"); return; }
  const row = { title, kind: g("ev-kind"), band: g("ev-band"), starts: g("ev-starts") || null, ends: g("ev-ends") || null, source: safeUrl(g("ev-source")) || null, note: g("ev-note") || null,
    districts: g("ev-districts").split(/[\s,;]+/).map(x => x.toUpperCase() === "ALL" ? "ALL" : K.normDistrict(x)).filter(Boolean), created_by: ME.user_id };
  try { const e = await DB.saveEvent(row); S.events.unshift(e); V.ev = e.id; render(); toast(`${affected(e).length} families affected`); } catch (e) { toast(e.message); }
}
async function checkFloods() {
  const out = $("#floods"); out.innerHTML = `<p class="sm mute">Checking…</p>`;
  const pts = []; S.clients.filter(c => c.status !== "closed").forEach(c => (c.data.homes || []).forEach(h => { const p = geoOf(c)[K.normDistrict(h.district)]; if (p) pts.push({ c, h, p }); }));
  if (!pts.length) { out.innerHTML = `<p class="sm mute">No family homes with a known location yet.</p>`; return; }
  const seen = new Map();
  for (const x of pts) {
    try { const r = await fetch(`https://environment.data.gov.uk/flood-monitoring/id/floods?lat=${x.p.lat}&long=${x.p.lng}&dist=10`); const j = await r.json();
      (j.items || []).forEach(it => { const k = it.floodAreaID || it.description; if (!seen.has(k)) seen.set(k, { it, fams: new Set() }); seen.get(k).fams.add(x.c.family_name); });
    } catch (e) { out.innerHTML = `<p class="sm">Couldn't reach the Environment Agency just now. Try again, or check <a href="https://check-for-flooding.service.gov.uk/" target="_blank" rel="noopener">their site</a>.</p>`; return; }
  }
  if (!seen.size) { out.innerHTML = `<p class="chip ok">No flood warnings or alerts near your families right now.</p>`; return; }
  const lvl = { 1: ["Severe flood warning", "gap"], 2: ["Flood warning", "gap"], 3: ["Flood alert", "thin"], 4: ["No longer in force", ""] };
  out.innerHTML = `<ul class="list">${[...seen.values()].sort((a, b) => a.it.severityLevel - b.it.severityLevel).map(({ it, fams }) => `<li><span class="chip ${(lvl[it.severityLevel] || [])[1] || ""}">${esc((lvl[it.severityLevel] || [it.severity])[0])}</span><span class="sp">${esc(it.description || it.eaAreaName || "")}<br><span class="xs mute">Near: ${esc([...fams].join(", "))}</span></span></li>`).join("")}</ul>`;
}

/* ===================== Settings ===================== */
function vSettings() {
  return `<h1>Settings</h1><p class="lead">What families see about you on their plan.</p><section class="card" style="max-width:560px">
  <label class="f"><span>Your name</span><input data-me="name" value="${esc(ME.name || "")}" maxlength="60"></label>
  <label class="f"><span>Phone families can call</span><input data-me="phone" value="${esc(ME.phone || "")}" maxlength="30"></label>
  <label class="f"><span>Email families can write to</span><input data-me="email" type="email" value="${esc(ME.email || "")}" maxlength="120"></label>
  <label class="f"><span>Your patch</span><input data-me="patch" value="${esc(ME.patch || "")}" maxlength="120" placeholder="Greater Manchester"></label>
  <button class="btn" data-act="saveme">Save</button></section>
  <section class="card" style="max-width:560px"><h2>Coordinators</h2><ul class="list">${S.coordinators.map(x => `<li><span class="sp"><b>${esc(x.name)}</b>${x.role === "admin" ? ' <span class="chip info">Admin</span>' : ""}<br><span class="xs mute">${esc(x.patch || "")}</span></span></li>`).join("")}</ul>
  <p class="xs mute">To add a coordinator, they make a Fettle account first, then an admin adds them in the database.</p></section>`;
}

/* ===================== events ===================== */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,a,tr[data-req],tr[data-client],input[type=checkbox]"); if (!t) return;
  const ds = t.dataset;
  if (ds.nav) { ev.preventDefault(); const x = {}; if (ds.reqtab) x.reqTab = ds.reqtab; if (ds.cf) x.cf = ds.cf; return nav(ds.nav, x); }
  if (ds.reqtab) { V.reqTab = ds.reqtab; V.req = null; return render(); }
  if (ds.req) { V.req = ds.req; return render(); }
  if (ds.openReq) { const r = S.requests.find(x => x.id === ds.openReq); return nav("requests", { reqTab: r.status, req: r.id }); }
  if (ds.client) return nav("client", { client: ds.client, tab: "call", step: 0 });
  if (ds.openClient) { const m = S.messages.filter(x => x.client_id === ds.openClient && x.kind === "family" && !x.seen); return nav("client", { client: ds.openClient, tab: ds.tab || "call", step: ds.step ? +ds.step : 0 }); }
  if (ds.openEv) return nav("watch", { ev: ds.openEv });
  if (ds.start) return startCall(ds.start);
  if (ds.cf) { V.cf = ds.cf; return render(); }
  if (ds.ctab) { V.tab = ds.ctab; return redrawAll(); }
  if (ds.step != null && t.classList.contains("step") || (ds.step != null && t.closest("#work"))) { V.step = +ds.step; redrawWork(); return scrollTo(0, 0); }
  if (ds.rqst) { await updReq(V.req, { status: ds.rqst }); V.reqTab = ds.rqst; return render(); }
  const c = C();
  if (ds.yn && c) { const cur = String(val(c, ds.yn)); const v = cur === ds.v ? undefined : ds.v === "true" ? true : ds.v === "false" ? false : "unknown";
    put(c, ds.yn, v); t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v)))); save(c); return ds.redraw !== undefined ? redrawWork() : rail(); }
  if (ds.outcome && c) { c.data.outcomes = c.data.outcomes || {}; c.data.outcomes[ds.outcome] = t.checked ? { done: true, at: today() } : { done: false }; save(c); return redrawWork(); }
  if (ds.contacted) { const e = S.events.find(x => x.id === V.ev); e.contacted = e.contacted || {}; if (t.checked) e.contacted[ds.contacted] = today(); else delete e.contacted[ds.contacted];
    try { await DB.saveEvent({ id: e.id, contacted: e.contacted }); } catch (x) { toast(x.message); } return render(); }
  if (ds.addPerson != null && c) { c.data.homes[+ds.addPerson].people.push({ id: "p" + short(), name: "", vuln: false }); save(c); return redrawWork(); }
  if (ds.delPerson && c) { const [i, j] = ds.delPerson.split(".").map(Number); c.data.homes[i].people.splice(j, 1); save(c); return redrawWork(); }
  if (ds.addHelper && c) { c.data.helpers = c.data.helpers || []; c.data.helpers.push({ id: "x" + short(), name: "", role: ds.addHelper, status: ["volunteer", "partner"].includes(ds.addHelper) ? "asked" : "" }); save(c); return redrawWork(); }
  if (ds.delHelper && c) { c.data.helpers.splice(+ds.delHelper, 1); save(c); return redrawWork(); }
  if (ds.delHome && c) { c.data.homes.splice(+ds.delHome, 1); save(c); return redrawWork(); }
  if (ds.seen) { const m = S.messages.find(x => x.id === ds.seen); m.seen = true; try { await DB.updMessage(m.id, { seen: true }); } catch (x) { toast(x.message); } return render(); }
  switch (ds.act) {
    case "signout": await DB.signOut(); ME = null; return boot();
    case "newclient": return newClient();
    case "addhome": c.data.homes.push({ id: "h" + short(), label: "Another home", district: "", people: [], a: {}, kit: { has: {} } }); save(c); return redrawWork();
    case "present": if (DB.demo) try { localStorage.setItem("fettle-demo-live-" + c.share_token, JSON.stringify(planPayload(c))); } catch (x) {}
      window.open(planUrl(c.share_token, "&live=1"), "fettle-present", "width=1100,height=900"); return;
    case "copylink": try { await navigator.clipboard.writeText(planUrl(c.share_token)); toast("Family link copied"); } catch (x) { prompt("Family link", planUrl(c.share_token)); } return;
    case "send": return sendModal();
    case "copymsg": try { await navigator.clipboard.writeText($("#sendbody").value); toast("Copied"); } catch (x) {} return;
    case "closemodal": return $("#modal").remove();
    case "marksent": return markSent();
    case "finish": c.data.call = c.data.call || {}; c.data.call.doneAt = new Date().toISOString(); c.next_review = c.next_review || addDays(365); stopTimer(); save(c);
      { const r = S.requests.find(x => x.client_id === c.id); if (r) await updReq(r.id, { status: "done" }); } toast("Call finished. Check the plan, then send it."); V.tab = "plan"; return redrawAll();
    case "timer": if (V.timer) stopTimer(); else V.timer = setInterval(() => { V.timerAt++; tickTimer(); }, 1000); return rail(), tickTimer();
    case "addnote": { const b = $("#note").value.trim(); if (!b) return; try { S.messages.unshift(await DB.addMessage({ client_id: c.id, kind: "note", body: b, author: ME.name })); } catch (x) { return toast(x.message); } return redrawWork(); }
    case "logev": return logEvent();
    case "floods": return checkFloods();
    case "closeev": { const e = S.events.find(x => x.id === V.ev); e.closed = !e.closed; try { await DB.saveEvent({ id: e.id, closed: e.closed }); } catch (x) { toast(x.message); } return render(); }
    case "addres": { const e = S.events.find(x => x.id === V.ev); let n = 0;
      for (const { c: cc } of affected(e)) { cc.data.resources = cc.data.resources || []; if (cc.data.resources.some(r => r.event === e.id)) continue;
        cc.data.resources.push({ title: e.title, band: e.band, source: e.source || "", note: e.note || "", added: today(), event: e.id }); n++;
        try { await DB.updClient(cc.id, { data: cc.data }); } catch (x) { toast(x.message); } }
      return toast(`Added to ${n} plan${n === 1 ? "" : "s"}`); }
    case "saveme": { const p = {}; document.querySelectorAll("[data-me]").forEach(i => p[i.dataset.me] = i.value.trim() || null); if (!p.name) return toast("Your name can't be empty");
      try { Object.assign(ME, await DB.updMe(ME.user_id, p)); const co = S.coordinators.find(x => x.user_id === ME.user_id); if (co) Object.assign(co, p); toast("Saved"); render(); } catch (x) { toast(x.message); } return; }
  }
});
function redrawAll() { const c = C(); if (!c) return render(); render(); }
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { V.q = t.value; const pos = t.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (t.dataset.k && t.tagName !== "SELECT" && t.type !== "checkbox") onField(t, false);
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.rq) { const v = t.value; const p = { [t.dataset.rq]: t.dataset.rq === "scheduled_at" ? (v ? new Date(v).toISOString() : null) : (v || null) };
    if (t.dataset.rq === "scheduled_at" && v) { const r = S.requests.find(x => x.id === V.req); if (r && ["new", "contacted"].includes(r.status)) p.status = "scheduled"; }
    updReq(V.req, p).then(() => { if (p.status) { V.reqTab = p.status; render(); } }); return; }
  if (t.closest("[data-multi]")) { const g = t.closest("[data-multi]"), c = C(); put(c, g.dataset.multi, [...g.querySelectorAll("input:checked")].map(i => i.value)); save(c); return redrawWork(); }
  if (t.dataset.k) onField(t, true);
});
function onField(t, committed) {
  const c = C(); if (!c) return;
  const k = t.dataset.k, ty = t.dataset.t;
  let v = t.type === "checkbox" ? t.checked : t.value;
  if (ty === "num") v = v === "" ? "" : +v;
  if (ty === "bool3") v = v === "" ? undefined : v === "true";
  if (ty === "str" && typeof v === "string" && k !== "@family_name" && !k.startsWith("!") && v === "") v = undefined;
  if (k === "@family_name") v = (v || "").slice(0, 80) || "Family";
  put(c, k, v); save(c);
  if (committed && t.hasAttribute("data-geo")) ensureGeo(c);
  if (k === "@status" && committed) return render();
  if (V.tab === "call" && V.step === 3 && k.startsWith("helpers.")) { const r = $("#reasons"); if (r) r.innerHTML = reasonsTable(c); return rail(); }
  if (committed && (t.hasAttribute("data-redraw") || t.type === "checkbox" || t.tagName === "SELECT")) redrawWork();
  else rail();
}

/* ===================== start ===================== */
function signinView(msg) {
  $("#root").innerHTML = `<div class="signin"><h1>Coordinator sign in</h1><p class="sm mute">Use your Fettle account. Only coordinators can open this page.</p>${msg ? `<p class="chip gap" style="white-space:normal">${esc(msg)}</p>` : ""}
  <form id="si"><label class="f"><span>Email</span><input type="email" id="si-e" required autocomplete="username"></label><label class="f"><span>Password</span><input type="password" id="si-p" required autocomplete="current-password"></label>
  <button class="btn" style="width:100%">Sign in</button></form><p class="xs mute" style="margin-top:14px">Want to see how it works first? <a href="?demo=1">Open the demo</a> with made-up families.</p></div>`;
  $("#si").addEventListener("submit", async e => { e.preventDefault(); try { await DB.signIn($("#si-e").value.trim(), $("#si-p").value); boot(); } catch (x) { signinView(x.message); } });
}
async function boot() {
  try { DB = DB || (DEMO ? fakeDB() : await liveDB()); } catch (e) { $("#root").innerHTML = `<p class="signin">Couldn't load. Check your connection and refresh.</p>`; return; }
  ME = await DB.me();
  if (!ME) return signinView();
  if (ME.notCoordinator) { $("#root").innerHTML = `<div class="signin"><h1>Not a coordinator yet</h1><p>You're signed in as ${esc(ME.email)}, but this account isn't set up as a Fettle coordinator.</p><button class="btn q" id="so">Sign out</button></div>`; $("#so").onclick = async () => { await DB.signOut(); ME = null; boot(); }; ME = null; return; }
  try { Object.assign(S, await DB.loadAll()); } catch (e) { toast(e.message); }
  S.clients.forEach(c => { c.data = c.data || {}; c.private = c.private || {}; });
  const h = (location.hash || "").slice(1).split("/");
  if (h[0] === "client" && client(h[1])) Object.assign(V, { view: "client", client: h[1] }); else if (["today", "requests", "clients", "watch", "settings"].includes(h[0])) V.view = h[0];
  render();
  if (!DB.demo) S.clients.filter(c => ["call", "plan_sent"].includes(c.status)).slice(0, 20).forEach(ensureGeo);
}
window.__coord = { V, S: () => S, render, K };
boot();
})();
</script>
