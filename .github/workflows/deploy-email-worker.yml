# Deploys the Fettle email worker (check-in reminders and postcode warnings) to Cloudflare.
# Runs when the worker's code changes on main, or by hand from the Actions tab ("Run workflow").
#
# One-off set-up, in GitHub: Settings > Secrets and variables > Actions > New repository secret.
#   CLOUDFLARE_API_TOKEN       a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID      your Cloudflare account ID (Workers & Pages overview, right-hand side)
#   SUPABASE_URL               https://iuluoohtiewakwepbhsm.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  from Supabase: Project settings > API keys
#   RESEND_API_KEY             from Resend: API keys
#   UNSUBSCRIBE_SECRET         the same value as the Pages site's UNSUBSCRIBE_SECRET
#   ALERT_TEST_TO (optional)   your own email: every warning email then goes only to you, marked [TEST]
# Each run copies these into the worker. Leave a secret out and the worker keeps the value it already has.
# Remove ALERT_TEST_TO from GitHub and run again to stop test mode.
name: Deploy email worker
on:
  push:
    branches: [main]
    paths: ["workers/reminders/**", "lib/server.js", ".github/workflows/deploy-email-worker.yml"]
  workflow_dispatch:
concurrency: email-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID aren't set yet, so nothing was deployed. See the top of this file."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: Run the email tests
        if: steps.ready.outputs.go == 'yes'
        run: npm test
      - name: Deploy
        if: steps.ready.outputs.go == 'yes'
        working-directory: workers/reminders
        run: npx --yes wrangler@3 deploy
      - name: Copy secrets into the worker
        if: steps.ready.outputs.go == 'yes'
        working-directory: workers/reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          ALERT_TEST_TO: ${{ secrets.ALERT_TEST_TO }}
        run: |
          for n in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY UNSUBSCRIBE_SECRET; do
            v="${!n}"; if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@3 secret put "$n" >/dev/null && echo "$n set"; else echo "$n not in GitHub: kept as it was"; fi
          done
          if [ -n "$ALERT_TEST_TO" ]; then printf '%s' "$ALERT_TEST_TO" | npx --yes wrangler@3 secret put ALERT_TEST_TO >/dev/null && echo "Test mode: warnings go only to the test address";
          else (yes | npx --yes wrangler@3 secret delete ALERT_TEST_TO) >/dev/null 2>&1 && echo "Test mode off" || echo "Test mode was already off"; fi
