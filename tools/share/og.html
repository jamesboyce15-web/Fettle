<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Fettle share image</title>
<!-- The picture shown when a Fettle link is shared (public/og.png, 1200 x 630). Rebuild with: node tools/share/make.cjs -->
<style>
@font-face{font-family:"Atkinson";src:url(../../book/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Atkinson";src:url(../../book/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Serif4";src:url(../../book/fonts/source-serif-4-latin-600-normal.woff2) format("woff2");font-weight:600}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;background:#173f35;color:#f6f7f4;font:400 26px/1.4 Atkinson,sans-serif;display:flex;padding:64px 64px 56px;gap:48px;overflow:hidden}
.l{flex:1;display:flex;flex-direction:column}
.mark{display:flex;align-items:center;gap:16px;font-size:38px;font-weight:700}
.rule{width:150px;height:9px;background:#f2a900;margin:34px 0 26px}
h1{font:600 62px/1.05 Serif4,Georgia,serif;margin:0;letter-spacing:-1px}
.foot{margin-top:auto;display:flex;align-items:center;gap:18px;font-size:27px}
.pill{background:#f2a900;color:#1c2522;font-weight:700;border-radius:12px;padding:10px 20px}
.foot span{color:#cfe3da}
.card{align-self:center;width:410px;background:#f6f7f4;color:#1c2522;border-radius:20px;padding:22px 30px}
.li{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:700;padding:15px 0;border-bottom:2px solid #cdd6d1}.li:last-child{border-bottom:0}
.cb{width:38px;height:38px;border:4px solid #173f35;border-radius:7px;flex:0 0 auto;background:#fff;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="l">
  <div class="mark"><svg width="62" height="62" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#f2a900"/><path d="M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z" fill="none" stroke="#173f35" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 14.5c1.9 1.7 2.8 3.2 2.8 4.6a2.8 2.8 0 0 1-5.6 0c0-1.4.9-2.9 2.8-4.6z" fill="#173f35"/></svg>fettle</div>
  <div class="rule"></div>
  <h1>Could your home cope for 3 days without power or water?</h1>
  <div class="foot"><b class="pill">Free 4-minute check</b><span>getfettle.co.uk</span></div>
</div>
<div class="card">
  <div class="li"><span class="cb"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" fill="none" stroke="#1d6b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Three days of water</div>
  <div class="li"><span class="cb"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" fill="none" stroke="#1d6b45" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Food you can eat cold</div>
  <div class="li"><span class="cb"></span>Numbers on paper</div>
  <div class="li"><span class="cb"></span>A plan everyone knows</div>
</div>
</body></html>
