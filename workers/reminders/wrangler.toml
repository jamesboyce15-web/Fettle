# Fettle check-in reminders: a small scheduled Worker, separate from the Pages site.
# Deploy with: cd workers/reminders && npx wrangler deploy
# Reminders are ON (DRY_RUN = "false"), approved by James on 13 November 2026: once deployed with its secrets, it emails
# people who asked for reminders. Set DRY_RUN to "true" to go back to logging only.
name = "fettle-reminders"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["17 10 * * *"]   # every day at 10:17 UTC

[vars]
DRY_RUN = "false"
SITE_URL = "https://getfettle.co.uk"
FROM_EMAIL = "Fettle <hello@getfettle.co.uk>"
# Secrets (add with `npx wrangler secret put NAME`, never in this file):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, UNSUBSCRIBE_SECRET (same value as the Pages site)
